name: Functional game UI preview
on:
  push:
    branches: ['integration/game-ui']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-preview:
    name: Real Rust and browser UI preview (not package acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run prepare:engraving
      - run: npx playwright install --with-deps chromium
      - id: rust_server
        run: cargo build -p practice-server --locked
      - name: Exercise checked difficulty through real Rust and browser audio
        if: ${{ !cancelled() && steps.rust_server.outcome == 'success' }}
        env:
          WMH_ARTIFACT_DIR: ui-preview
        run: |
          set -o pipefail
          mkdir -p ui-preview
          node --test --test-reporter=tap tests/assistance-app-browser.test.js | tee ui-preview/assistance.tap
      - name: Exercise shared piano geometry, skin persistence, human timbres and finite live-audio silence
        if: ${{ !cancelled() && steps.rust_server.outcome == 'success' }}
        env:
          WMH_ARTIFACT_DIR: ui-preview
        run: |
          set -o pipefail
          mkdir -p ui-preview
          node --test --test-reporter=tap --test-name-pattern='^(real free piano fills desktop|original grand staff and Jianpu follow|game menu and audible song preview|normal and free piano share|original falling bars visibly cross|real D768 lobby and compact performance fit|short-landscape following reveals|real guitar current and next six-note|real initial compact guide stays|real compact 88-key and custom extreme guides|real piano hands preserve merged ties|real short-landscape guitar keeps a complete labelled row and transport beside notation|real home menu keeps its hitbox stable at the hover boundary|real unmuted live worklet verifies finite silence through (settings|authoring) after (keyup|navigation)$|real skin UI import preserves paused input and finite live worklet silence$|real skin selection survives closing and reopening the same browser profile$|real home cards stay reachable without footer overlap at native, compact and long-label sizes$|real human Mod timbres preserve shared ownership, PCM, legacy storage and interrupted controls$|real guitar human union replans held strings across Mod subsets and explicit All$)' tests/full-app-browser.test.js | tee ui-preview/tests.tap
      - name: Verify preview provenance, required screenshots and finite live-audio evidence
        run: node scripts/verify-ui-preview.mjs ui-preview
      - name: Retain compact failure pixels and geometry before the full preview
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: game-ui-failures-${{ github.sha }}
          path: |
            ui-preview/worldmusichub-live-failure-*.png
            ui-preview/worldmusichub-live-assistance-*.json
            ui-preview/worldmusichub-live-assistance-*.png
            ui-preview/worldmusichub-live-complete-guitar-chords.json
            ui-preview/worldmusichub-live-guitar-complete-chords-*.png
            ui-preview/worldmusichub-live-failure-*.json
            ui-preview/worldmusichub-live-bootstrap*.json
            ui-preview/worldmusichub-compact-*-precheck.json
            ui-preview/worldmusichub-live-piano-notice-layout.json
            ui-preview/worldmusichub-live-compact-*-budget.json
            ui-preview/worldmusichub-human-mod-*.json
            ui-preview/worldmusichub-human-mod-*.png
            ui-preview/worldmusichub-guitar-human-union*.json
            ui-preview/worldmusichub-guitar-human-union*.png
            ui-preview/worldmusichub-live-silence-*.json
            ui-preview/worldmusichub-skin-*.json
            ui-preview/worldmusichub-skin-*.png
            ui-preview/worldmusichub-home-hover-boundary*.json
            ui-preview/worldmusichub-home-hover-boundary*.png
            ui-preview/worldmusichub-home-layout.json
            ui-preview/worldmusichub-home-layout-*.png
            ui-preview/worldmusichub-live-guitar-render-*.json
            ui-preview/worldmusichub-live-guitar-render-*.png
            ui-preview/worldmusichub-live-simultaneous-844x390-guitar*.json
            ui-preview/worldmusichub-live-simultaneous-844x390-guitar*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: game-ui-preview-${{ github.sha }}
          path: |
            ui-preview/*.png
            ui-preview/*.json
            ui-preview/tests.tap
            ui-preview/assistance.tap
          if-no-files-found: warn
