name: Windows milestone build
on:
  push:
    branches: ['dev/initial-prototype']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  milestone:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.count.outputs.build }}
      count: ${{ steps.count.outputs.count }}
      sha: ${{ steps.count.outputs.sha }}
      recovery: ${{ steps.count.outputs.recovery_for }}
      label: ${{ steps.count.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - id: count
        run: python3 scripts/windows-build-gate.py

  package:
    needs: milestone
    if: needs.milestone.outputs.build == 'true'
    runs-on: windows-latest
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.milestone.outputs.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rust-docs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install YAML parser for authoring QA
        run: python -m pip install PyYAML==6.0.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run prepare:engraving
      - run: npm test
      - run: cargo test --workspace --target x86_64-pc-windows-msvc --locked
      - run: cargo build -p practice-server --release --target x86_64-pc-windows-msvc --locked
      - name: Check full API against the Windows release binary
        run: python tests/server_smoke.py
        env:
          WMH_SERVER_BINARY: target/x86_64-pc-windows-msvc/release/practice-server.exe
      - name: Check bounded HTTP reuse in the native release binary
        run: python tests/server_connection_smoke.py --report "${{ runner.temp }}/wmh-screenshots/worldmusichub-live-connections.json"
        env:
          WMH_SERVER_BINARY: target/x86_64-pc-windows-msvc/release/practice-server.exe
      - name: Smoke-test exact release executable
        shell: pwsh
        run: |
          $app = Start-Process target/x86_64-pc-windows-msvc/release/practice-server.exe -ArgumentList '--no-open','--port','17879' -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 40; $i++) {
              try { $health = Invoke-RestMethod http://127.0.0.1:17879/api/health; $ready = $true; break } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $ready -or $health.engine -ne 'rust') { throw 'Release executable did not become healthy' }
            $manifest = Invoke-RestMethod http://127.0.0.1:17879/vendor/engraving-manifest.json
            if ($manifest.version -ne '2.1.3') { throw 'Pinned offline engraving assets missing' }
            $page = Invoke-WebRequest http://127.0.0.1:17879/
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'WorldMusicClub') { throw 'Embedded UI missing' }
          } finally { if (-not $app.HasExited) { Stop-Process -Id $app.Id } }
      - run: npx playwright install chromium
      - name: Test Windows release through real browser UI
        run: npm run test:full-app
        env:
          WMH_SERVER_BINARY: target/x86_64-pc-windows-msvc/release/practice-server.exe
          WMH_ARTIFACT_DIR: ${{ runner.temp }}/wmh-screenshots
      - name: Verify offline engraving in Windows release
        run: npm run test:engraving-browser
        env:
          WMH_SERVER_BINARY: target/x86_64-pc-windows-msvc/release/practice-server.exe
          WMH_ARTIFACT_DIR: ${{ runner.temp }}/wmh-screenshots
      - name: Verify rhythm shell in Windows release
        run: node scripts/hosted-rhythm-check.mjs
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SERVER_BINARY: target/x86_64-pc-windows-msvc/release/practice-server.exe
          WMH_ARTIFACT_DIR: ${{ runner.temp }}/wmh-screenshots/rhythm
          WMH_SOURCE_SHA: ${{ needs.milestone.outputs.sha }}
          WMH_SOURCE_REF: ${{ github.ref_name }}
          WMH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Preserve Windows release screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release-screenshots-${{ needs.milestone.outputs.label }}
          path: |
            ${{ runner.temp }}/wmh-screenshots/rhythm/
            ${{ runner.temp }}/wmh-screenshots/*.png
            ${{ runner.temp }}/wmh-screenshots/worldmusichub-omr-*.json
            ${{ runner.temp }}/wmh-screenshots/worldmusichub-live-*.json
            ${{ runner.temp }}/wmh-screenshots/worldmusichub-binding-*.json
          if-no-files-found: ignore
      - run: cargo fetch --locked
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/prepare-rust-notices.py --target x86_64-pc-windows-msvc
      - name: Create portable Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/WorldMusicClub -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/practice-server.exe dist/WorldMusicClub/WorldMusicClub.exe
          Copy-Item README.md,LICENSE dist/WorldMusicClub/
          Copy-Item docs/WINDOWS.md dist/WorldMusicClub/START-HERE.md
          New-Item -ItemType Directory -Path dist/WorldMusicClub/licenses/engraving -Force | Out-Null
          Copy-Item web/vendor/*.txt,web/vendor/engraving-manifest.json dist/WorldMusicClub/licenses/engraving/
          Copy-Item -Recurse docs dist/WorldMusicClub/
          Copy-Item -Recurse schema,schemas dist/WorldMusicClub/
          Copy-Item -Recurse catalog dist/WorldMusicClub/
          Copy-Item -Recurse dist/licenses/rust dist/WorldMusicClub/licenses/
          python scripts/release-manifest.py create dist/WorldMusicClub --commit '${{ needs.milestone.outputs.sha }}' --count '${{ needs.milestone.outputs.count }}' --recovery-for '${{ needs.milestone.outputs.recovery }}'
          if ($LASTEXITCODE -ne 0) { throw 'Release inventory failed' }
          python scripts/release-manifest.py archive dist/WorldMusicClub dist/WorldMusicClub-Windows-x64-${{ needs.milestone.outputs.label }}.zip
          if ($LASTEXITCODE -ne 0) { throw 'Portable archive verification failed' }
      - name: Smoke-test the extracted portable package and offline renderer bytes
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'wmh-portable-smoke'
          Expand-Archive -Path dist/WorldMusicClub-Windows-x64-${{ needs.milestone.outputs.label }}.zip -DestinationPath $destination
          $directory = Join-Path $destination 'WorldMusicClub'
          $executable = Join-Path $directory 'WorldMusicClub.exe'
          $info = Get-Content (Join-Path $directory 'BUILD-INFO.json') -Raw | ConvertFrom-Json
          if ($info.git_commit -ne '${{ needs.milestone.outputs.sha }}' -or $info.commit_count -ne ${{ needs.milestone.outputs.count }}) { throw 'Wrong milestone provenance' }
          if ([int]$info.recovery_for -ne ${{ needs.milestone.outputs.recovery }} -or $info.release_label -ne '${{ needs.milestone.outputs.label }}') { throw 'Wrong recovery provenance' }
          $reportedVersion = & $executable --version
          if ($LASTEXITCODE -ne 0 -or $reportedVersion -cne ('WorldMusicClub ' + $info.app_version)) { throw 'Extracted executable reports a different version' }
          $app = Start-Process $executable -WorkingDirectory $directory -ArgumentList '--no-open','--port','17880' -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 40; $i++) {
              try { $health = Invoke-RestMethod http://127.0.0.1:17880/api/health; $ready = $true; break } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $ready -or $health.engine -ne 'rust') { throw 'Extracted executable did not start' }
            if ($health.version -ne $info.app_version -or $health.score_schema_revision -ne $info.score_schema_revision) { throw 'Packaged executable and format metadata differ' }
            foreach ($edition in $info.curated_editions) {
              $scorePath = Join-Path $directory ('catalog/' + $edition.directory + '/score.json')
              $packaged = Get-Content $scorePath -Raw -Encoding utf8 | ConvertFrom-Json
              $embedded = Invoke-RestMethod ('http://127.0.0.1:17880/api/catalog/score/' + $edition.id)
              if ($embedded.id -cne $packaged.id -or $embedded.source.content -cne $packaged.source.content -or $embedded.provenance.license -cne $edition.license) { throw 'Embedded edition differs from packaged source archive' }
            }
            $manifest = Invoke-RestMethod http://127.0.0.1:17880/vendor/engraving-manifest.json
            $bundle = Join-Path $env:RUNNER_TEMP 'wmh-packaged-osmd.js'
            Invoke-WebRequest http://127.0.0.1:17880/vendor/opensheetmusicdisplay.min.js -OutFile $bundle
            if ((Get-FileHash $bundle -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.bundleSha256) { throw 'Embedded offline renderer checksum differs' }
          } finally { if (-not $app.HasExited) { Stop-Process -Id $app.Id } }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: WorldMusicClub-Windows-x64-${{ needs.milestone.outputs.label }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
