name: Complete clean song UI preview
on:
  push:
    branches: ['feature/complete-song-pack']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clean-song-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clean-ui:
    name: Real Rust clean packages and runtime media (not native acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.99.0'
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run prepare:engraving
      - run: npx playwright install --with-deps chromium
      - run: cargo build -p worldmusichub-desktop --example native_import_driver --locked
      - run: cargo build -p practice-server --locked
      - name: Check complete original fixture through actual native protocol
        env:
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
        run: node scripts/check-clean-song-native.mjs
      - name: Check original fixture inventory
        run: node --test tests/clean-song-schema.test.js tests/clean-song-package-fixtures.test.js
      - name: Import, play, export and reopen the complete package
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
        run: node scripts/hosted-clean-song-check.mjs
      - name: Authored VSQ protocol, evidence verifier and actual browser flow
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
        run: |
          node scripts/check-vsq-song-native.mjs
          node --test tests/native-vsq-song-evidence.test.js
          WMH_VIEWPORT_HEIGHT=720 node scripts/hosted-vsq-song-check.mjs
          WMH_VIEWPORT_HEIGHT=900 node scripts/hosted-vsq-song-check.mjs
      - name: Retain exact-source clean package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clean-song-ui-preview-${{ github.sha }}
          path: |
            test-results/clean-song/
            test-results/vsq-song/
          if-no-files-found: warn
