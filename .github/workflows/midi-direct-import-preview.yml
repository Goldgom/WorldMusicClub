name: Direct MIDI import compatibility preview
on:
  push:
    branches: ['preview/midi-direct-import']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: midi-direct-import-${{ github.ref }}
  cancel-in-progress: true
# Original fixtures only. This job never publishes packages or advances main.
jobs:
  direct-midi:
    name: Raw MIDI picker, real Rust persistence and playable restart
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.99.0'
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run prepare:engraving
      - run: cargo build -p worldmusichub-desktop --example native_import_driver --locked
      - run: cargo build -p practice-server --locked
      - run: npx playwright install --with-deps chromium
      - name: Exercise original raw MIDI through visible import and Start
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
          WMH_SERVER_BINARY: ${{ github.workspace }}/target/debug/practice-server
          WMH_ARTIFACT_DIR: ${{ runner.temp }}/midi-direct-import
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          mkdir -p "$WMH_ARTIFACT_DIR"
          node scripts/hosted-midi-direct-import-check.mjs | tee "$WMH_ARTIFACT_DIR/tests.log"
      - name: Retain exact-source compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: midi-direct-import-${{ github.sha }}
          path: ${{ runner.temp }}/midi-direct-import/
          if-no-files-found: warn
