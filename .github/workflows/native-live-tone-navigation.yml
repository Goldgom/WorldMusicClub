name: Native finite live-tone navigation preview
on:
  push:
    branches: ['preview/native-live-tone-navigation']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-live-tone-navigation-${{ github.ref }}
  cancel-in-progress: true
# Optional focused evidence only. No package/release creation or promotion.
jobs:
  native-live-navigation:
    name: Four original native key and navigation cases
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run prepare:engraving
      - run: npm run test:native-live-navigation
      - run: cargo fmt --all --check
      - run: cargo test -p worldmusichub-desktop --lib acceptance::tests --locked
      - name: Pure fixed-key ownership and profile contracts
        shell: pwsh
        run: |
          foreach ($script in @('scripts/windows-desktop-acceptance.ps1','scripts/windows-desktop-profile.ps1','tests/windows-live-tone-navigation-contract.ps1')) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$errors)
            if ($errors.Count) { $errors | Format-List; throw "PowerShell syntax errors in $script" }
          }
          ./tests/windows-live-tone-navigation-contract.ps1
      - run: cargo build -p worldmusichub-desktop --release --locked
      - name: Actual native original KeyR and navigation evidence
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'Unexpected native build source' }
          if (git status --porcelain --untracked-files=normal) { throw 'Native acceptance source is dirty' }
          ./scripts/windows-desktop-acceptance.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory "$env:RUNNER_TEMP/live-tone-navigation-windows" -Scenario live-tone-navigation
      - name: Independently reverify executable-bound finite evidence
        shell: pwsh
        env:
          WMH_LIVE_TONE_NAVIGATION_EXECUTABLE: ${{ github.workspace }}/target/release/worldmusichub-desktop.exe
        run: |
          node scripts/verify-native-live-tone-navigation-evidence.mjs --check "$env:RUNNER_TEMP/live-tone-navigation-windows"
          if ($LASTEXITCODE -ne 0) { throw 'Native finite live-tone navigation proof failed' }
      - name: Collect bounded native JSON diagnostics
        if: always()
        run: >-
          python scripts/collect-json-evidence.py
          "${{ runner.temp }}" "${{ runner.temp }}/live-tone-navigation-json"
          --root live-tone-navigation-windows
          --source-sha "${{ github.sha }}"
      - name: Retain native JSON diagnostics after success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-live-tone-navigation-json-${{ github.sha }}
          path: ${{ runner.temp }}/live-tone-navigation-json/
          if-no-files-found: warn
          include-hidden-files: true
      - name: Retain original native evidence and exact executable, excluding profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-live-tone-navigation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/live-tone-navigation-windows/**
            !${{ runner.temp }}/live-tone-navigation-windows/webview-profiles/**
            target/release/worldmusichub-desktop.exe
          if-no-files-found: warn
