name: Verify WorldMusicHub
on:
  push:
    branches: ['dev/initial-prototype', 'integration/rhythm-ui']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build -p practice-server --locked
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python tests/server_smoke.py
      - name: Check bounded ordinary HTTP connection reuse
        run: python tests/server_connection_smoke.py --report "${{ runner.temp }}/wmh-connections.json"
      - name: Preserve connection lifetime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: connection-lifetime-${{ matrix.os }}
          path: ${{ runner.temp }}/wmh-connections.json
          if-no-files-found: ignore
      - run: python -m unittest discover -s tests -p 'test_*.py'
  frontend:
    runs-on: ubuntu-latest
    # A stalled dependency download must reach a terminal result, not occupy
    # the runner for GitHub's default six-hour job allowance.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - id: npm_dependencies
        run: npm ci --ignore-scripts --omit=optional
      - id: engraving_assets
        run: npm run prepare:engraving
      - run: npm test
      - id: browser_setup
        if: ${{ !cancelled() && steps.npm_dependencies.outcome == 'success' && steps.engraving_assets.outcome == 'success' }}
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - id: rust_toolchain
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - id: rust_server
        if: ${{ !cancelled() && steps.rust_toolchain.outcome == 'success' }}
        run: cargo build -p practice-server --locked
      # A failed suite must not hide evidence from another prepared suite.
      # No continue-on-error: any failed step still makes this job fail.
      - name: Check mocked browser behavior
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        run: npm run test:browser
      - name: Check real Rust-backed application
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' && steps.rust_server.outcome == 'success' }}
        run: npm run test:full-app
      - name: Check real offline engraving
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' && steps.rust_server.outcome == 'success' }}
        run: npm run test:engraving-browser
      - name: Check actual rhythm shell on its integration branch
        if: ${{ !cancelled() && (github.ref == 'refs/heads/integration/rhythm-ui' || github.head_ref == 'integration/rhythm-ui') && steps.browser_setup.outcome == 'success' && steps.rust_server.outcome == 'success' }}
        timeout-minutes: 10
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_ARTIFACT_DIR: ${{ runner.temp }}/worldmusichub-rhythm
          WMH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WMH_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
          WMH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/hosted-rhythm-check.mjs
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-regression-screenshots
          path: |
            /tmp/worldmusichub-*.png
            /tmp/worldmusichub-omr-*.json
            /tmp/worldmusichub-live-*.json
            /tmp/worldmusichub-binding-*.json
            ${{ runner.temp }}/worldmusichub-rhythm/
          if-no-files-found: ignore
