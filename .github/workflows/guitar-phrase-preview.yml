name: Guitar written phrase focused preview
on:
  push:
    branches: ['preview/guitar-phrase']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guitar-phrase-${{ github.ref }}
  cancel-in-progress: true
# Original fixtures only. No release/package publication or main promotion.
jobs:
  guitar-phrase:
    name: Actual Rust and trusted browser phrase controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.99.0'
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run prepare:engraving
      - run: node --test tests/guitar-phrase-preview.test.js
      - run: cargo test -p score-core guitar_fingering --locked
      - run: cargo build -p practice-server --locked
      - run: npx playwright install --with-deps chromium
      - name: Whole to exact phrase and both request phases through real controls
        env:
          WMH_ARTIFACT_DIR: ${{ runner.temp }}/guitar-phrase-preview
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_SERVER_BINARY: ${{ github.workspace }}/target/debug/practice-server
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          mkdir -p "$WMH_ARTIFACT_DIR"
          node --test --test-reporter=tap --test-name-pattern='^real guitar written phrase preserves exact union and fences both Rust request phases$' tests/full-app-browser.test.js | tee "$WMH_ARTIFACT_DIR/tests.tap"
      - name: Independently verify source, server, complete claims and screenshot bytes
        env:
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_SERVER_BINARY: ${{ github.workspace }}/target/debug/practice-server
        run: node scripts/verify-guitar-phrase-preview.mjs "${{ runner.temp }}/guitar-phrase-preview"
      - name: Retain bounded original evidence on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guitar-phrase-preview-${{ github.sha }}
          path: |
            ${{ runner.temp }}/guitar-phrase-preview/worldmusichub-guitar-phrase*.json
            ${{ runner.temp }}/guitar-phrase-preview/worldmusichub-guitar-phrase*.png
            ${{ runner.temp }}/guitar-phrase-preview/worldmusichub-live-failure-*.json
            ${{ runner.temp }}/guitar-phrase-preview/worldmusichub-live-failure-*.png
            ${{ runner.temp }}/guitar-phrase-preview/worldmusichub-live-bootstrap*.json
            ${{ runner.temp }}/guitar-phrase-preview/worldmusichub-live-bootstrap*.png
            ${{ runner.temp }}/guitar-phrase-preview/tests.tap
          if-no-files-found: warn
