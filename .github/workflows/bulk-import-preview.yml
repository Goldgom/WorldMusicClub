name: Native song-pack import UI preview
on:
  push:
    branches: ['feature/song-pack-import']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bulk-import-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bulk-ui:
    name: Real Rust storage and bulk import UI (not Windows acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run prepare:engraving
      - run: npx playwright install --with-deps chromium
      - run: cargo build -p worldmusichub-desktop --example native_import_driver --locked
      - name: Exercise original pack imports through real Rust persistence
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
        run: node scripts/hosted-bulk-import-check.mjs
      - name: Preserve source-bound import workflow screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bulk-import-ui-preview-${{ github.sha }}
          path: test-results/bulk-import/
          if-no-files-found: warn
      - name: Build the real backend for affected checkpoint regressions
        id: recovery_backend
        run: cargo build -p practice-server --locked
      - name: Check invalid single-score routing and assessment ownership
        if: ${{ !cancelled() && steps.recovery_backend.outcome == 'success' }}
        run: >-
          node --test
          --test-name-pattern='tempo recompiles, export retains canonical JSON|a failed replacement import cannot strand a take'
          tests/frontend-browser.test.js
      - name: Check saved sources and compact piano controls
        if: ${{ !cancelled() && steps.recovery_backend.outcome == 'success' }}
        env:
          WMH_ARTIFACT_DIR: ${{ runner.temp }}/worldmusichub-import-recovery
        run: >-
          node --test
          --test-name-pattern='standard MusicXML|real local library preserves|real whole-score semitone preview|MXL .* browser import retains|real no-score Free practice|real initial compact guide|real compact 88-key|normal and free piano share'
          tests/full-app-browser.test.js
      - name: Preserve affected-regression evidence without replacing full acceptance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: import-recovery-browser-${{ github.sha }}
          path: |
            ${{ runner.temp }}/worldmusichub-import-recovery/
            /tmp/worldmusichub-mock-failure-*.png
          if-no-files-found: warn
