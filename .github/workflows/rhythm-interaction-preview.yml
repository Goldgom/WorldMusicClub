name: Rhythm interaction preview
on:
  push:
    branches: ['integration/rhythm-ui', 'preview/rhythm-controls']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rhythm-interaction-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rhythm-ui:
    name: Rhythm controls and stalled-keyboard timing (not package acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.99.0'
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run prepare:engraving
      - run: node --test tests/stalled-keyboard-evidence.test.js
      - id: rhythm_browser_setup
        run: npx playwright install --with-deps chromium
      - id: rhythm_server
        run: cargo build -p practice-server --locked
      - name: Exercise actual hover, Pause, notation and free recording
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_ARTIFACT_DIR: ${{ runner.temp }}/wmc-rhythm-preview
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_SOURCE_REF: ${{ github.ref_name }}
          WMH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/hosted-rhythm-check.mjs
      - name: Verify delayed trusted keyboard events against actual Rust scoring
        if: ${{ !cancelled() && steps.rhythm_server.outcome == 'success' && steps.rhythm_browser_setup.outcome == 'success' }}
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_ARTIFACT_DIR: ${{ runner.temp }}/wmc-stalled-keyboard
          WMH_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/hosted-stalled-keyboard-check.mjs
      - name: Preserve exact-source rhythm evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rhythm-interaction-preview-${{ github.sha }}
          path: ${{ runner.temp }}/wmc-rhythm-preview/
          if-no-files-found: warn
      - name: Preserve original delayed-input evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stalled-keyboard-preview-${{ github.sha }}
          path: ${{ runner.temp }}/wmc-stalled-keyboard/
          if-no-files-found: warn
