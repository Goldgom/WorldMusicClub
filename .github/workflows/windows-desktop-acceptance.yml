name: Native Windows feature acceptance
on:
  push:
    branches: ['integration/native-desktop', 'validation/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-feature-acceptance:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy, rust-docs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run prepare:engraving
      - run: npm test
      - run: node --test tests/desktop-evidence.test.js tests/desktop-acceptance-wait.test.js tests/native-song-folder-evidence.test.js
      - name: Parse the exact native acceptance script
        shell: pwsh
        run: |
          foreach ($script in @('scripts/windows-desktop-acceptance.ps1','scripts/windows-native-portable-smoke.ps1')) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$errors)
            if ($errors.Count) { $errors | Format-List; throw "PowerShell syntax errors in $script" }
          }
      - name: Test native filename ownership and approved fixture paths without GUI
        shell: pwsh
        run: ./tests/windows-desktop-contract.ps1
      # Only public generated build artifacts; no Cargo home, credentials, UI
      # evidence, incremental state or packaged executable/ZIP. Keep both lists equal.
      - name: Restore native Rust build cache
        id: native_rust_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 3
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/release/.fingerprint
            target/release/build
            target/release/deps
          # Reuse across source-only edits; Cargo still checks source freshness.
          # No broad restore key can cross dependency/build-configuration changes.
          key: native-rust-v1-${{ runner.os }}-${{ runner.arch }}-msvc-1.99.0-crt-static-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '.cargo/config*', 'rust-toolchain*', '.github/workflows/windows-desktop-acceptance.yml') }}
          fail-on-cache-miss: false
          enableCrossOsArchive: false
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - id: native_build
        run: cargo build -p worldmusichub-desktop --release --locked
      # Save after successful compilation, before UI acceptance can fail. This is
      # a build cache only; all native acceptance, provenance and ZIP gates still run.
      - name: Save native Rust build cache
        if: success() && steps.native_build.outcome == 'success' && steps.native_rust_cache.outputs.cache-hit != 'true' && steps.native_rust_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/release/.fingerprint
            target/release/build
            target/release/deps
          key: ${{ steps.native_rust_cache.outputs.cache-primary-key }}
          enableCrossOsArchive: false
      - run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/prepare-rust-notices.py --target x86_64-pc-windows-msvc --output dist/licenses/native-rust
      - name: Bound startup, offline engraving and normal native close
        shell: pwsh
        run: ./scripts/windows-desktop-smoke.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory desktop-startup
      - name: Native files, restart, keyboard, library and close acceptance
        shell: pwsh
        run: ./scripts/windows-desktop-acceptance.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory desktop-acceptance
      - name: Native song folders and fresh-profile restart acceptance
        shell: pwsh
        run: ./scripts/windows-desktop-acceptance.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory desktop-song-folder -Scenario song-folder
      # Default success() keeps all package steps behind the actual native gates.
      - name: Package accepted native executable with exact provenance and notices
        id: native_package
        shell: pwsh
        run: |
          $count=(git rev-list --count HEAD).Trim()
          $folder='dist/WorldMusicHub-Native'
          New-Item -ItemType Directory "$folder/licenses/engraving","$folder/evidence" -Force | Out-Null
          Copy-Item target/release/worldmusichub-desktop.exe "$folder/WorldMusicHub-Native.exe"
          Copy-Item LICENSE $folder
          Copy-Item docs/WINDOWS_NATIVE.md "$folder/README.md"
          Copy-Item docs/WINDOWS_NATIVE.md "$folder/START-HERE.md"
          Copy-Item -Recurse docs,schema,catalog $folder
          Copy-Item web/vendor/*.txt,web/vendor/engraving-manifest.json "$folder/licenses/engraving/"
          Copy-Item -Recurse dist/licenses/native-rust "$folder/licenses/rust"
          Copy-Item desktop-startup/native-report.json,desktop-startup/renderer-report.json "$folder/evidence/"
          Copy-Item desktop-acceptance/native-acceptance.json,desktop-acceptance/downloaded-files.json,desktop-acceptance/renderer-*.json "$folder/evidence/"
          python scripts/native-release-manifest.py create $folder --commit '${{ github.sha }}' --count $count --startup desktop-startup --acceptance desktop-acceptance --song-folder desktop-song-folder
          if ($LASTEXITCODE -ne 0) { throw 'Native provenance/acceptance inventory failed' }
          $zip="dist/WorldMusicHub-Native-Windows-x64-commit-$count.zip"
          python scripts/native-release-manifest.py archive $folder $zip
          if ($LASTEXITCODE -ne 0) { throw 'Native archive verification failed' }
          "archive=$zip" >> $env:GITHUB_OUTPUT
          "count=$count" >> $env:GITHUB_OUTPUT
      - name: Verify normal startup of extracted native preview
        shell: pwsh
        run: |
          $destination=Join-Path $env:RUNNER_TEMP 'wmh-native-portable-extracted'
          Expand-Archive -Path '${{ steps.native_package.outputs.archive }}' -DestinationPath $destination
          ./scripts/windows-native-portable-smoke.ps1 -Directory (Join-Path $destination 'WorldMusicHub-Native') -OutputDirectory desktop-portable
      - name: Preserve bounded evidence on success and failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-feature-evidence-${{ github.sha }}
          path: |
            desktop-startup/*.json
            desktop-startup/*.png
            desktop-startup/*.log
            desktop-acceptance/*.json
            desktop-acceptance/*.png
            desktop-acceptance/*.log
            desktop-song-folder/*.json
            desktop-song-folder/*.png
            desktop-song-folder/*.log
            desktop-song-folder/downloads/*
            desktop-song-folder/Scores/songs/*/*
            desktop-song-folder/Scores/backups/*/*
            desktop-portable/*.json
            desktop-portable/*.png
            desktop-portable/*.log
          if-no-files-found: warn
      - name: Upload verified native portable preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: WorldMusicHub-Native-Windows-x64-commit-${{ steps.native_package.outputs.count }}-${{ github.sha }}
          path: |
            dist/WorldMusicHub-Native-Windows-x64-*.zip
            dist/WorldMusicHub-Native-Windows-x64-*.zip.sha256
          if-no-files-found: error
      # No WebView profile, private fixtures, installer or GitHub Release upload.
