name: Native Windows feature acceptance
on:
  push:
    branches: ['integration/native-desktop', 'validation/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bulk-import-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.acceptance_source.outputs.source_sha }}
      source_tree: ${{ steps.acceptance_source.outputs.source_tree }}
      run_id: ${{ github.run_id }}
      management_pack_browser: ${{ steps.management_pack_browser.outcome }}
      management_catalog_browser: ${{ steps.management_catalog_browser.outcome }}
      management_catalog_browser_verify: ${{ steps.management_catalog_browser_verify.outcome }}
      complete_practice_protocol: ${{ steps.complete_practice_protocol.outcome }}
      complete_practice_browser: ${{ steps.complete_practice_browser.outcome }}
      canonical_practice_protocol: ${{ steps.canonical_practice_protocol.outcome }}
      canonical_practice_browser_720: ${{ steps.canonical_practice_browser_720.outcome }}
      canonical_practice_browser_720_verify: ${{ steps.canonical_practice_browser_720_verify.outcome }}
      canonical_practice_browser_640: ${{ steps.canonical_practice_browser_640.outcome }}
      canonical_practice_browser_640_verify: ${{ steps.canonical_practice_browser_640_verify.outcome }}
      identity: ${{ steps.acceptance_identity.outputs.identity }}
      producer_gate: ${{ steps.producer_gate.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: required_001
        with:
          ref: ${{ github.sha }}
      - name: Record exact acceptance source
        id: acceptance_source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: required_003
        with:
          toolchain: '1.99.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        id: required_004
        with:
          python-version: '3.12.14'
      # QA-only parser dependency; it is never included in the app package.
      - run: python -m pip install PyYAML==6.0.3
        id: required_005
      - run: python scripts/check-authoring-workflow.py .github/workflows/windows-desktop-acceptance.yml
        id: required_006
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        id: required_007
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Bind exact source, locks and installed toolchain
        id: acceptance_identity
        run: python scripts/native-acceptance-join.py identity
      - run: npm ci --ignore-scripts --omit=optional
        id: required_009
      - run: npm run prepare:engraving
        id: required_010
      - run: node --test tests/complete-practice-acceptance.test.js
        id: required_011
      - run: npm run test:canonical-practice-acceptance
        id: required_012
      - run: npm run test:bulk-import
        id: required_013
      - run: node --test tests/pitch-bend-import-baseline.test.js tests/native-pitch-bend-evidence.test.js tests/pitch-bend-acceptance-workflow.test.js
        id: required_014
      - run: node --test tests/song-authoring-model.test.js tests/frontend-song-authoring.test.js tests/song-authoring-acceptance-fixtures.test.js tests/native-song-authoring-evidence.test.js tests/authoring-acceptance-workflow.test.js tests/authoring-final-gate.test.js
        id: required_015
      - id: dense_native_driver
        run: cargo build -p worldmusichub-desktop --example native_import_driver --locked
      - name: Original current Basic catalog protection through Rust stdin and app DOM
        id: required_017
        timeout-minutes: 6
        env:
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
          WMH_CATALOG_DRIVER_BUILD_SHA: ${{ github.sha }}
          WMH_CURRENT_BASIC_REPORT: ${{ runner.temp }}/library-management-browser/current-basic-native.json
        run: npm run test:current-basic-catalog-native
      - id: complete_practice_converter
        run: cargo build -p score-core --bin clean-song-batch --locked
      - id: notation_server
        run: cargo build -p practice-server --locked
      - name: Original basic-key CLI bytes and native receiver protocol
        id: required_020
        env:
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_BASIC_KEY_CONVERTER: ${{ github.workspace }}/target/debug/clean-song-batch
          WMH_BASIC_KEY_REPORT: ${{ github.workspace }}/test-results/basic-key/native-protocol/report.json
        run: node scripts/check-basic-key-native.mjs
      - name: Original complete-practice source bytes and Rust target union
        id: complete_practice_protocol
        if: ${{ !cancelled() && steps.dense_native_driver.outcome == 'success' && steps.complete_practice_converter.outcome == 'success' }}
        env:
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
          WMH_COMPLETE_PRACTICE_CONVERTER: ${{ github.workspace }}/target/debug/clean-song-batch
          WMH_COMPLETE_PRACTICE_REPORT: ${{ github.workspace }}/test-results/complete-practice/native-protocol/report.json
        run: node scripts/check-complete-practice-native.mjs
      - name: Original canonical JSON and MusicXML through exact Rust and production app DOM
        id: canonical_practice_protocol
        if: ${{ !cancelled() && steps.dense_native_driver.outcome == 'success' }}
        timeout-minutes: 3
        env:
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_SOURCE_TREE: ${{ steps.acceptance_source.outputs.source_tree }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
          WMH_CANONICAL_PRACTICE_REPORT: ${{ github.workspace }}/test-results/canonical-practice/native-protocol/report.json
        run: node scripts/check-canonical-practice-native.mjs
      - name: Complete clean media package through actual Rust protocol
        id: required_023
        env:
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
        run: node scripts/check-clean-song-native.mjs
      - name: Complete authored VSQ package through actual Rust protocol
        id: required_024
        env:
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
        run: node scripts/check-vsq-song-native.mjs
      - name: Complete typed performance packages through actual Rust protocol
        id: required_025
        env:
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
        run: node scripts/check-performance-song-native.mjs
      - name: Original pitch packages through exact Rust protocol
        id: required_026
        env:
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
        run: node scripts/check-pitch-bend-native.mjs
      - name: Whole original MIDI authoring through exact Rust protocol
        id: required_027
        env:
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
          WMH_AUTHORING_REPORT: ${{ github.workspace }}/test-results/song-authoring/native-protocol/report.json
        run: node scripts/check-song-authoring-native.mjs
      - name: Real DOM and native Rust disk route without a listener
        id: required_028
        env:
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
          WMH_IMPORT_REPORT: ${{ github.workspace }}/test-results/bulk-import-dom.json
        run: npm run test:bulk-import-native
      - name: Original VSQ authoring through exact Rust protocol
        id: required_029
        env:
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
          WMH_VSQ_AUTHORING_REPORT: ${{ github.workspace }}/test-results/vsq-authoring/native-protocol/report.json
        run: node scripts/check-vsq-authoring-native.mjs
      - id: dense_browser_setup
        run: npx playwright install --with-deps chromium
      - name: Real picker, original bytes, unified pack and fresh-profile screenshot proof
        id: required_031
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
        run: npm run test:bulk-import-hosted
      - name: VSQ chooser, explicit practice, native following, exact export and restart
        id: required_032
        # Own fixture, storage directory and processes; preserve any earlier failure.
        if: ${{ !cancelled() && steps.notation_server.outcome == 'success' && steps.dense_native_driver.outcome == 'success' && steps.dense_browser_setup.outcome == 'success' }}
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
        run: |
          WMH_VIEWPORT_HEIGHT=720 node scripts/hosted-vsq-song-check.mjs
          WMH_VIEWPORT_HEIGHT=900 node scripts/hosted-vsq-song-check.mjs
      - name: Complete performance chooser, explicit reference controls, exact export and restart
        id: required_033
        # Own fixture, storage directory and processes; preserve any earlier failure.
        if: ${{ !cancelled() && steps.notation_server.outcome == 'success' && steps.dense_native_driver.outcome == 'success' && steps.dense_browser_setup.outcome == 'success' }}
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
        run: |
          WMH_VIEWPORT_HEIGHT=720 node scripts/hosted-performance-song-check.mjs
          WMH_VIEWPORT_HEIGHT=900 node scripts/hosted-performance-song-check.mjs
      - name: Original pitch policy, exact receiver clocks, pause/resume and unchanged take
        id: required_034
        # Own fixture, storage directory and processes; preserve any earlier failure.
        if: ${{ !cancelled() && steps.notation_server.outcome == 'success' && steps.dense_native_driver.outcome == 'success' && steps.dense_browser_setup.outcome == 'success' }}
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
        run: |
          WMH_VIEWPORT_HEIGHT=720 node scripts/hosted-pitch-bend-check.mjs
          WMH_VIEWPORT_HEIGHT=900 node scripts/hosted-pitch-bend-check.mjs
      - name: Original authoring picker, complete review, save and restart at all sizes
        id: required_035
        # Own fixture, storage directory and processes; preserve any earlier failure.
        if: ${{ !cancelled() && steps.notation_server.outcome == 'success' && steps.dense_native_driver.outcome == 'success' && steps.dense_browser_setup.outcome == 'success' }}
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
        run: |
          WMH_VIEWPORT_WIDTH=1280 WMH_VIEWPORT_HEIGHT=720 node scripts/hosted-song-authoring-check.mjs
          WMH_VIEWPORT_WIDTH=1280 WMH_VIEWPORT_HEIGHT=900 node scripts/hosted-song-authoring-check.mjs
          WMH_VIEWPORT_WIDTH=1920 WMH_VIEWPORT_HEIGHT=1080 node scripts/hosted-song-authoring-check.mjs
      - name: Original basic-key real keyboard, Chinese inventory, exact export and restart
        id: required_036
        # Own fixture, storage directory and processes; preserve any earlier failure.
        if: ${{ !cancelled() && steps.notation_server.outcome == 'success' && steps.dense_native_driver.outcome == 'success' && steps.dense_browser_setup.outcome == 'success' }}
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
          WMH_SERVER_BINARY: ${{ github.workspace }}/target/debug/practice-server
        run: |
          WMH_VIEWPORT_HEIGHT=720 node scripts/hosted-basic-key-check.mjs
          WMH_VIEWPORT_HEIGHT=900 node scripts/hosted-basic-key-check.mjs
      - name: Original complete-practice trusted controls, targets, sound and labels
        id: complete_practice_browser
        if: ${{ !cancelled() && steps.notation_server.outcome == 'success' && steps.dense_native_driver.outcome == 'success' && steps.dense_browser_setup.outcome == 'success' }}
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
          WMH_SERVER_BINARY: ${{ github.workspace }}/target/debug/practice-server
        run: |
          WMH_VIEWPORT_WIDTH=1280 WMH_VIEWPORT_HEIGHT=720 node scripts/hosted-complete-practice-check.mjs
          WMH_VIEWPORT_WIDTH=960 WMH_VIEWPORT_HEIGHT=640 node scripts/hosted-complete-practice-check.mjs
      - name: Original canonical actual application at 1280x720
        id: canonical_practice_browser_720
        # Independent original source/storage; three phases are each bounded to 120s.
        if: ${{ !cancelled() && steps.notation_server.outcome == 'success' && steps.dense_native_driver.outcome == 'success' && steps.dense_browser_setup.outcome == 'success' }}
        timeout-minutes: 8
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_SOURCE_TREE: ${{ steps.acceptance_source.outputs.source_tree }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
          WMH_SERVER_BINARY: ${{ github.workspace }}/target/debug/practice-server
          WMH_VIEWPORT_WIDTH: '1280'
          WMH_VIEWPORT_HEIGHT: '720'
          WMH_ARTIFACT_DIR: ${{ github.workspace }}/test-results/canonical-practice/720
        run: |
          test ! -e "$WMH_ARTIFACT_DIR"
          node scripts/hosted-canonical-practice-check.mjs
      - name: Create and reverify original canonical 720px proof against exact source and driver
        id: canonical_practice_browser_720_verify
        if: ${{ !cancelled() && steps.canonical_practice_browser_720.outcome == 'success' }}
        timeout-minutes: 2
        env:
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_SOURCE_TREE: ${{ steps.acceptance_source.outputs.source_tree }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
          WMH_ARTIFACT_DIR: ${{ github.workspace }}/test-results/canonical-practice/720
        run: |
          node scripts/verify-canonical-practice-evidence.mjs "$WMH_ARTIFACT_DIR"
          node scripts/verify-canonical-practice-evidence.mjs --check "$WMH_ARTIFACT_DIR"
      - name: Original canonical actual application at 960x640
        id: canonical_practice_browser_640
        # Independent original source/storage; three phases are each bounded to 120s.
        if: ${{ !cancelled() && steps.notation_server.outcome == 'success' && steps.dense_native_driver.outcome == 'success' && steps.dense_browser_setup.outcome == 'success' }}
        timeout-minutes: 8
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_SOURCE_TREE: ${{ steps.acceptance_source.outputs.source_tree }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
          WMH_SERVER_BINARY: ${{ github.workspace }}/target/debug/practice-server
          WMH_VIEWPORT_WIDTH: '960'
          WMH_VIEWPORT_HEIGHT: '640'
          WMH_ARTIFACT_DIR: ${{ github.workspace }}/test-results/canonical-practice/640
        run: |
          test ! -e "$WMH_ARTIFACT_DIR"
          node scripts/hosted-canonical-practice-check.mjs
      - name: Create and reverify original canonical 640px proof against exact source and driver
        id: canonical_practice_browser_640_verify
        if: ${{ !cancelled() && steps.canonical_practice_browser_640.outcome == 'success' }}
        timeout-minutes: 2
        env:
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_SOURCE_TREE: ${{ steps.acceptance_source.outputs.source_tree }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
          WMH_ARTIFACT_DIR: ${{ github.workspace }}/test-results/canonical-practice/640
        run: |
          node scripts/verify-canonical-practice-evidence.mjs "$WMH_ARTIFACT_DIR"
          node scripts/verify-canonical-practice-evidence.mjs --check "$WMH_ARTIFACT_DIR"
      - name: Original VSQ authoring, whole inventory, explicit practice and restart
        id: required_042
        # Own fixtures, Scores and fresh processes; no basic-key evidence input.
        if: ${{ !cancelled() && steps.dense_native_driver.outcome == 'success' && steps.dense_browser_setup.outcome == 'success' }}
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
        run: |
          WMH_VIEWPORT_WIDTH=1280 WMH_VIEWPORT_HEIGHT=720 node scripts/hosted-vsq-authoring-check.mjs
          WMH_VIEWPORT_WIDTH=1280 WMH_VIEWPORT_HEIGHT=900 node scripts/hosted-vsq-authoring-check.mjs
          WMH_VIEWPORT_WIDTH=1920 WMH_VIEWPORT_HEIGHT=1080 node scripts/hosted-vsq-authoring-check.mjs
      - name: Original twelve-part Current and All notation, scrolling and real page following
        id: required_043
        # Own original fixture/server; a failed earlier scenario must stay visible.
        if: ${{ !cancelled() && steps.notation_server.outcome == 'success' && steps.dense_browser_setup.outcome == 'success' }}
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_SERVER_BINARY: ${{ github.workspace }}/target/debug/practice-server
        run: node scripts/hosted-notation-scope-check.mjs
      - name: Continuous original dense audio across real native page rendering
        id: required_044
        if: ${{ !cancelled() && steps.notation_server.outcome == 'success' && steps.dense_native_driver.outcome == 'success' && steps.dense_browser_setup.outcome == 'success' }}
        timeout-minutes: 4
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
          WMH_SERVER_BINARY: ${{ github.workspace }}/target/debug/practice-server
        run: node scripts/hosted-dense-rendition-check.mjs
      - name: Original pack picker, duplicates, paging and selected exports
        id: management_pack_browser
        # Independent original fixtures and storage; earlier failures stay failed.
        if: ${{ !cancelled() && steps.notation_server.outcome == 'success' && steps.dense_native_driver.outcome == 'success' && steps.dense_browser_setup.outcome == 'success' }}
        timeout-minutes: 6
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
          WMH_SERVER_BINARY: ${{ github.workspace }}/target/debug/practice-server
          WMH_ARTIFACT_DIR: ${{ runner.temp }}/library-management-browser/packs
        run: |
          test ! -e "$WMH_ARTIFACT_DIR"
          npm run test:pack-management-hosted
      - name: Three original catalog processes with one persisted browser profile
        id: management_catalog_browser
        if: ${{ !cancelled() && steps.notation_server.outcome == 'success' && steps.dense_native_driver.outcome == 'success' && steps.dense_browser_setup.outcome == 'success' }}
        timeout-minutes: 15
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
          WMH_SERVER_BINARY: ${{ github.workspace }}/target/debug/practice-server
          WMH_ARTIFACT_DIR: ${{ runner.temp }}/library-management-browser/catalog
        run: |
          test ! -e "$WMH_ARTIFACT_DIR"
          npm run test:library-catalog-hosted
      - name: Reverify hosted catalog source, native driver and retained bytes
        id: management_catalog_browser_verify
        if: ${{ !cancelled() && steps.management_catalog_browser.outcome == 'success' }}
        env:
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
          WMH_SERVER_BINARY: ${{ github.workspace }}/target/debug/practice-server
        run: |
          export WMH_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          node scripts/verify-library-catalog-acceptance.mjs --check "$RUNNER_TEMP/library-management-browser/catalog"
      - name: Retain original canonical browser proof, source files and exact driver
        id: required_048
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: canonical-practice-browser-${{ github.sha }}
          # Root JSON retains proof, report, action/results and renderer geometry.
          # Only original fixture/library data; no browser profile directory.
          path: |
            test-results/canonical-practice/*/*.json
            test-results/canonical-practice/*/*.png
            test-results/canonical-practice/*/*.log
            test-results/canonical-practice/*/downloads/*
            test-results/canonical-practice/*/fixtures/*
            test-results/canonical-practice/*/Scores/songs/**
            test-results/canonical-practice/*/Scores/backups/**
            target/debug/examples/native_import_driver
          retention-days: 90
          if-no-files-found: warn
      - name: Retain original management browser proof, exact driver and asset server
        id: required_049
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: library-management-browser-${{ github.sha }}
          path: |
            ${{ runner.temp }}/library-management-browser/**
            !${{ runner.temp }}/library-management-browser/**/webview-catalog-profile/**
            target/debug/examples/native_import_driver
            target/debug/practice-server
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
      - name: Retain original dense rendition timing and source evidence
        id: required_050
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dense-rendition-browser-${{ github.sha }}
          path: |
            test-results/dense-rendition/report.json
            test-results/dense-rendition/*.png
            test-results/dense-rendition/fixture/*
            test-results/dense-rendition/ui-pages/*.json
          retention-days: 90
          if-no-files-found: warn
      - name: Retain original notation scope and fit evidence
        id: required_051
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: notation-scope-browser-${{ github.sha }}
          path: |
            test-results/notation-scope/report.json
            test-results/notation-scope/*.png
            test-results/notation-scope/server.log
          retention-days: 90
          if-no-files-found: warn
      - name: Retain small basic-key browser diagnostics
        id: required_052
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: basic-key-browser-diagnostics-${{ github.sha }}
          path: |
            test-results/basic-key/*/report.json
            test-results/basic-key/*/renderer-basic-key-*.json
            test-results/basic-key/*/browser-basic-key-failure.png
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve authored bulk-import evidence
        id: required_053
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bulk-import-browser-${{ github.sha }}
          path: |
            test-results/vsq-authoring/**
            test-results/basic-key/**
            test-results/complete-practice/*/*.json
            test-results/complete-practice/*/*.png
            test-results/complete-practice/*/downloads/*.json
            test-results/complete-practice/*/fixtures/*
            test-results/complete-practice/*/Scores/clean-songs/**
            test-results/complete-practice/*/Scores/clean-backups/**
            test-results/bulk-import-dom.json
            test-results/bulk-import/**
            test-results/vsq-song/**
            test-results/performance-song/*/*.json
            test-results/performance-song/*/*.png
            test-results/performance-song/*/downloads/*
            test-results/performance-song/*/fixtures/*
            test-results/performance-song/*/Scores/clean-songs/**
            test-results/performance-song/*/Scores/clean-backups/**
            test-results/performance-song/*/Scores/imports/**
            test-results/performance-song/*/Scores/import-backups/**
            test-results/pitch-bend/*/*.json
