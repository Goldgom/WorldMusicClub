name: Native Windows feature acceptance
on:
  push:
    branches: ['integration/native-desktop']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-feature-acceptance:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy, rust-docs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run prepare:engraving
      - run: npm test
      - run: node --test tests/desktop-evidence.test.js
      - name: Parse the exact native acceptance script
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/windows-desktop-acceptance.ps1),[ref]$tokens,[ref]$errors)
          if ($errors.Count) { $errors | Format-List; throw 'PowerShell syntax errors' }
      - name: Test native filename ownership and approved fixture paths without GUI
        shell: pwsh
        run: ./tests/windows-desktop-contract.ps1
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build -p worldmusichub-desktop --release --locked
      - run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/prepare-rust-notices.py --target x86_64-pc-windows-msvc --output dist/licenses/native-rust
      - name: Bound startup, offline engraving and normal native close
        shell: pwsh
        run: ./scripts/windows-desktop-smoke.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory desktop-startup
      - name: Native files, restart, keyboard, library and close acceptance
        shell: pwsh
        run: ./scripts/windows-desktop-acceptance.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory desktop-acceptance
      - name: Preserve bounded evidence on success and failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-feature-evidence-${{ github.sha }}
          path: |
            desktop-startup/*.json
            desktop-startup/*.png
            desktop-startup/*.log
            desktop-acceptance/*.json
            desktop-acceptance/*.png
            desktop-acceptance/*.log
          if-no-files-found: warn
      # No EXE, WebView profile, fixtures, installer or Release is distributed.
