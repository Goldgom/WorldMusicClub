          if-no-files-found: error
          include-hidden-files: true
  native-feature-acceptance:
    # Independent runners retain Windows diagnostics when browser checks fail.
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      source_sha: ${{ steps.acceptance_source.outputs.source_sha }}
      source_tree: ${{ steps.acceptance_source.outputs.source_tree }}
      run_id: ${{ github.run_id }}
      management_catalog_windows: ${{ steps.management_catalog_windows.outcome }}
      management_catalog_windows_verify: ${{ steps.management_catalog_windows_verify.outcome }}
      complete_practice_windows: ${{ steps.complete_practice_windows.outcome }}
      complete_practice_windows_verify: ${{ steps.complete_practice_windows_verify.outcome }}
      canonical_practice_windows: ${{ steps.canonical_practice_windows.outcome }}
      canonical_practice_windows_verify: ${{ steps.canonical_practice_windows_verify.outcome }}
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Record exact acceptance source
        id: acceptance_source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy, rust-docs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # QA-only parser dependency; it is never included in the app package.
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/check-authoring-workflow.py .github/workflows/windows-desktop-acceptance.yml
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run prepare:engraving
      - run: node --test tests/complete-practice-acceptance.test.js
      - run: npm run test:canonical-practice-acceptance
      - run: npm test
      - run: node --test tests/desktop-evidence.test.js tests/desktop-acceptance-wait.test.js tests/native-song-folder-evidence.test.js tests/native-bulk-import-evidence.test.js tests/native-clean-song-evidence.test.js tests/native-vsq-song-evidence.test.js tests/vsq-fingering-evidence.test.js tests/performance-song-fixtures.test.js tests/native-performance-song-evidence.test.js tests/pitch-bend-import-baseline.test.js tests/native-pitch-bend-evidence.test.js tests/pitch-bend-acceptance-workflow.test.js
      - run: node --test tests/song-authoring-model.test.js tests/frontend-song-authoring.test.js tests/song-authoring-acceptance-fixtures.test.js tests/native-song-authoring-evidence.test.js tests/authoring-acceptance-workflow.test.js tests/authoring-final-gate.test.js
      - name: Parse the exact native acceptance script
        shell: pwsh
        run: |
          foreach ($script in @('scripts/windows-desktop-acceptance.ps1','scripts/windows-desktop-profile.ps1','scripts/windows-desktop-catalog-snapshot.ps1','scripts/windows-desktop-geometry.ps1','scripts/windows-native-portable-smoke.ps1')) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$errors)
            if ($errors.Count) { $errors | Format-List; throw "PowerShell syntax errors in $script" }
          }
      - name: Test native filename ownership and approved fixture paths without GUI
        shell: pwsh
        run: ./tests/windows-desktop-contract.ps1
      # Only public generated build artifacts; no Cargo home, credentials, UI
      # evidence, incremental state or packaged executable/ZIP. Keep both lists equal.
      - name: Restore native Rust build cache
        id: native_rust_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 3
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/release/.fingerprint
            target/release/build
            target/release/deps
          # Reuse across source-only edits; Cargo still checks source freshness.
          # No broad restore key can cross dependency/build-configuration changes.
          key: native-rust-v1-${{ runner.os }}-${{ runner.arch }}-msvc-1.99.0-crt-static-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '.cargo/config*', 'rust-toolchain*', '.github/workflows/windows-desktop-acceptance.yml') }}
          fail-on-cache-miss: false
          enableCrossOsArchive: false
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - id: native_build
        run: cargo build -p worldmusichub-desktop --release --locked
      # Save after successful compilation, before UI acceptance can fail. This is
      # a build cache only; all native acceptance, provenance and ZIP gates still run.
      - name: Save native Rust build cache
        if: success() && steps.native_build.outcome == 'success' && steps.native_rust_cache.outputs.cache-hit != 'true' && steps.native_rust_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/release/.fingerprint
            target/release/build
            target/release/deps
          key: ${{ steps.native_rust_cache.outputs.cache-primary-key }}
          enableCrossOsArchive: false
      - run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/prepare-rust-notices.py --target x86_64-pc-windows-msvc --output dist/licenses/native-rust
      - name: Bound startup, offline engraving and normal native close
        shell: pwsh
        run: ./scripts/windows-desktop-smoke.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory desktop-startup
      - name: Native files, restart, keyboard, library and close acceptance
        shell: pwsh
        run: ./scripts/windows-desktop-acceptance.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory desktop-acceptance
      - name: Native song folders and fresh-profile restart acceptance
        shell: pwsh
        run: ./scripts/windows-desktop-acceptance.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory desktop-song-folder -Scenario song-folder
      - name: Native batch import, source retention and unified pack acceptance
        shell: pwsh
        run: ./scripts/windows-desktop-acceptance.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory desktop-bulk-import -Scenario bulk-import
      - name: Native complete clean song, decoded media, export and new-process persistence
        shell: pwsh
        run: ./scripts/windows-desktop-acceptance.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory desktop-clean-song -Scenario clean-song
      - name: Native VSQ chooser, explicit choice, exact following, export and fresh-process reset
        shell: pwsh
        run: ./scripts/windows-desktop-acceptance.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory desktop-vsq-song -Scenario vsq-song
      - name: Native complete performance chooser, reference controls, exact export and fresh-process restart
        shell: pwsh
        run: ./scripts/windows-desktop-acceptance.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory desktop-performance-song -Scenario performance-song
      - name: Native original pitch policy, source-clock bends and held-state reconstruction
        shell: pwsh
        run: ./scripts/windows-desktop-acceptance.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory desktop-pitch-bend -Scenario pitch-bend
      - name: Native original authoring pair, explicit saves, exact export and fresh-process restart
        shell: pwsh
        run: ./scripts/windows-desktop-acceptance.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory desktop-authoring -Scenario authoring
      - name: Native original basic-key inventory, keyboard and restart
        shell: pwsh
        run: ./scripts/windows-desktop-acceptance.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory desktop-basic-key -Scenario basic-key
      - name: Native complete-practice trusted popup, key input, labels and measured viewport
        id: complete_practice_windows
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/windows-desktop-acceptance.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory desktop-complete-practice -Scenario complete-practice
      - name: Reverify complete-practice source, executable and original evidence
        id: complete_practice_windows_verify
        if: ${{ !cancelled() && steps.complete_practice_windows.outcome == 'success' }}
        shell: pwsh
        env:
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_COMPLETE_PRACTICE_EXECUTABLE: ${{ github.workspace }}/target/release/worldmusichub-desktop.exe
        run: |
          $env:WMH_SOURCE_TREE=(git rev-parse 'HEAD^{tree}').Trim()
          node scripts/verify-complete-practice-evidence.mjs --check desktop-complete-practice
          if ($LASTEXITCODE -ne 0) { throw 'Complete-practice exact-source proof failed' }
      - name: Native original canonical controls, PCM, exports and three-process restart
        id: canonical_practice_windows
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        # Three owned native phases are each bounded to 240s.
        timeout-minutes: 14
        shell: pwsh
        env:
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_SOURCE_TREE: ${{ steps.acceptance_source.outputs.source_tree }}
          WMH_CANONICAL_PRACTICE_EXECUTABLE: ${{ github.workspace }}/target/release/worldmusichub-desktop.exe
        run: |
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'Unexpected canonical build source' }
          if (git status --porcelain --untracked-files=normal) { throw 'Canonical acceptance source is dirty' }
          ./scripts/windows-desktop-acceptance.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory desktop-canonical-practice -Scenario canonical-practice
      - name: Reverify canonical source, exact executable and every retained native result
        id: canonical_practice_windows_verify
        if: ${{ !cancelled() && steps.canonical_practice_windows.outcome == 'success' }}
        timeout-minutes: 2
        shell: pwsh
        env:
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_CANONICAL_PRACTICE_EXECUTABLE: ${{ github.workspace }}/target/release/worldmusichub-desktop.exe
        run: |
          $env:WMH_SOURCE_TREE=(git rev-parse 'HEAD^{tree}').Trim()
          node scripts/verify-canonical-practice-evidence.mjs --check desktop-canonical-practice
          if ($LASTEXITCODE -ne 0) { throw 'Canonical-practice exact-source proof failed' }
      - name: Native original VSQ authoring and exact fresh-process restart
        # Generates its own fixtures and profile from the same checked build.
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/windows-desktop-acceptance.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory desktop-vsq-authoring -Scenario vsq-authoring
      - name: Native original catalog controls and three-process recovery
        id: management_catalog_windows
        # The exact packaged EXE, with an independent original library and profile.
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'Unexpected catalog build source' }
          if (git status --porcelain --untracked-files=normal) { throw 'Catalog acceptance source is dirty' }
          ./scripts/windows-desktop-acceptance.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory "$env:RUNNER_TEMP/library-management-windows" -Scenario library-catalog
      - name: Reverify native catalog source, executable and retained bytes
        id: management_catalog_windows_verify
        if: ${{ !cancelled() && steps.management_catalog_windows.outcome == 'success' }}
        shell: pwsh
        env:
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_LIBRARY_CATALOG_EXECUTABLE: ${{ github.workspace }}/target/release/worldmusichub-desktop.exe
        run: |
          $env:WMH_SOURCE_TREE=git rev-parse 'HEAD^{tree}'
          node scripts/verify-library-catalog-acceptance.mjs --check "$env:RUNNER_TEMP/library-management-windows"
          if ($LASTEXITCODE -ne 0) { throw 'Native catalog exact-source proof failed' }
      - name: Retain original native catalog proof and exact EXE
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: library-management-windows-${{ github.sha }}
          path: |
            ${{ runner.temp }}/library-management-windows/**
            !${{ runner.temp }}/library-management-windows/webview-catalog-profile/**
            target/release/worldmusichub-desktop.exe
          include-hidden-files: true
          if-no-files-found: warn
      # Default success() keeps candidate packaging behind every native gate.
      # This job cannot establish browser or whole-checkpoint acceptance.
      - name: Package native candidate with exact provenance and notices
        id: native_package
        shell: pwsh
        run: |
          node scripts/verify-native-bulk-import-evidence.mjs --check desktop-bulk-import
          if ($LASTEXITCODE -ne 0) { throw 'Native bulk-import exact-source proof failed' }
          $bulkProof=Get-Content -Raw desktop-bulk-import/native-bulk-import-files.json | ConvertFrom-Json
          $currentTree=(git rev-parse 'HEAD^{tree}').Trim()
          $currentExe=(Get-FileHash target/release/worldmusichub-desktop.exe -Algorithm SHA256).Hash.ToLower()
          if ($bulkProof.source_sha -cne '${{ github.sha }}' -or $bulkProof.source_tree -cne $currentTree -or $bulkProof.executable_sha256 -cne $currentExe) { throw 'Bulk-import evidence does not match the exact packaged source and executable' }
          node scripts/verify-native-clean-song-evidence.mjs --check desktop-clean-song
          if ($LASTEXITCODE -ne 0) { throw 'Native clean-song exact-source proof failed' }
          $cleanProof=Get-Content -Raw desktop-clean-song/native-clean-song-files.json | ConvertFrom-Json
          if ($cleanProof.source_sha -cne '${{ github.sha }}' -or $cleanProof.source_tree -cne $currentTree -or $cleanProof.executable_sha256 -cne $currentExe) { throw 'Clean-song evidence does not match the exact packaged source and executable' }
          node scripts/verify-native-vsq-song-evidence.mjs --check desktop-vsq-song
          if ($LASTEXITCODE -ne 0) { throw 'Native VSQ exact-source proof failed' }
          $vsqProof=Get-Content -Raw desktop-vsq-song/native-vsq-song-files.json | ConvertFrom-Json
          if ($vsqProof.source_sha -cne '${{ github.sha }}' -or $vsqProof.source_tree -cne $currentTree -or $vsqProof.executable_sha256 -cne $currentExe) { throw 'VSQ evidence does not match the exact packaged source and executable' }
          node scripts/verify-native-performance-song-evidence.mjs --check desktop-performance-song
          if ($LASTEXITCODE -ne 0) { throw 'Native complete performance exact-source proof failed' }
          $performanceProof=Get-Content -Raw desktop-performance-song/native-performance-song-files.json | ConvertFrom-Json
          $currentExeBytes=(Get-Item target/release/worldmusichub-desktop.exe).Length
          if ($performanceProof.source_sha -cne '${{ github.sha }}' -or $performanceProof.source_tree -cne $currentTree -or $performanceProof.executable_sha256 -cne $currentExe -or $performanceProof.executable_bytes -ne $currentExeBytes) { throw 'Complete performance evidence does not match the exact packaged source and executable' }
          node scripts/verify-native-pitch-bend-evidence.mjs --check desktop-pitch-bend
          if ($LASTEXITCODE -ne 0) { throw 'Native pitch-bend exact-source proof failed' }
          $pitchProof=Get-Content -Raw desktop-pitch-bend/native-pitch-bend-files.json | ConvertFrom-Json
          if ($pitchProof.source_sha -cne '${{ github.sha }}' -or $pitchProof.source_tree -cne $currentTree -or $pitchProof.executable_sha256 -cne $currentExe -or $pitchProof.executable_bytes -ne $currentExeBytes) { throw 'Pitch-bend evidence does not match the exact packaged source and executable' }
          python scripts/native-pitch-bend-manifest.py desktop-pitch-bend --executable target/release/worldmusichub-desktop.exe --commit '${{ github.sha }}' --tree $currentTree
          if ($LASTEXITCODE -ne 0) { throw 'Native pitch-bend focused manifest failed' }
          node scripts/verify-native-song-authoring-evidence.mjs --check desktop-authoring
          if ($LASTEXITCODE -ne 0) { throw 'Native song authoring exact-source proof failed' }
          $authoringProof=Get-Content -Raw desktop-authoring/native-song-authoring-files.json | ConvertFrom-Json
          if ($authoringProof.source_sha -cne '${{ github.sha }}' -or $authoringProof.source_tree -cne $currentTree -or $authoringProof.executable_sha256 -cne $currentExe -or $authoringProof.executable_bytes -ne $currentExeBytes) { throw 'Song authoring evidence does not match the exact packaged source and executable' }
          python scripts/native-song-authoring-manifest.py desktop-authoring --executable target/release/worldmusichub-desktop.exe --commit '${{ github.sha }}' --tree $currentTree
          if ($LASTEXITCODE -ne 0) { throw 'Native song authoring focused manifest failed' }
          node scripts/verify-native-vsq-authoring-evidence.mjs --check desktop-vsq-authoring
          if ($LASTEXITCODE -ne 0) { throw 'Native VSQ authoring proof failed' }
          python scripts/native-vsq-authoring-manifest.py desktop-vsq-authoring --executable target/release/worldmusichub-desktop.exe --commit '${{ github.sha }}' --tree $currentTree
          if ($LASTEXITCODE -ne 0) { throw 'Native VSQ authoring source/EXE manifest failed' }
          $env:WMH_SOURCE_SHA='${{ github.sha }}'
          $env:WMH_SOURCE_TREE=$currentTree
          $env:WMH_BASIC_KEY_EXECUTABLE=(Resolve-Path 'target/release/worldmusichub-desktop.exe').Path
          node scripts/verify-basic-key-evidence.mjs --check desktop-basic-key
          if ($LASTEXITCODE -ne 0) { throw 'Basic-key evidence does not match exact packaged source and executable' }
          $env:WMH_COMPLETE_PRACTICE_EXECUTABLE=(Resolve-Path 'target/release/worldmusichub-desktop.exe').Path
          node scripts/verify-complete-practice-evidence.mjs --check desktop-complete-practice
          if ($LASTEXITCODE -ne 0) { throw 'Complete-practice evidence does not match exact packaged source and executable' }
          $env:WMH_CANONICAL_PRACTICE_EXECUTABLE=(Resolve-Path 'target/release/worldmusichub-desktop.exe').Path
          node scripts/verify-canonical-practice-evidence.mjs --check desktop-canonical-practice
          if ($LASTEXITCODE -ne 0) { throw 'Canonical-practice evidence does not match exact packaged source and executable' }
          $count=(git rev-list --count HEAD).Trim()
          $folder='dist/WorldMusicClub-Native'
          New-Item -ItemType Directory "$folder/licenses/engraving","$folder/evidence" -Force | Out-Null
          Copy-Item target/release/worldmusichub-desktop.exe "$folder/WorldMusicClub-Native.exe"
          Copy-Item LICENSE $folder
          Copy-Item desktop-basic-key/native-basic-key.json,desktop-basic-key/basic-key-proof.json,desktop-basic-key/renderer-basic-key-*.json,desktop-basic-key/profile-basic-key-*.json "$folder/evidence/"
          Copy-Item desktop-complete-practice/native-complete-practice.json,desktop-complete-practice/complete-practice-proof.json,desktop-complete-practice/renderer-complete-practice-*.json,desktop-complete-practice/profile-complete-practice-*.json "$folder/evidence/"
          Copy-Item desktop-canonical-practice/native-canonical-practice.json,desktop-canonical-practice/canonical-practice-proof.json,desktop-canonical-practice/renderer-canonical-practice-*.json,desktop-canonical-practice/profile-canonical-practice-*.json "$folder/evidence/"
          Copy-Item docs/WINDOWS_NATIVE.md "$folder/README.md"
          Copy-Item docs/WINDOWS_NATIVE.md "$folder/START-HERE.md"
          Copy-Item -Recurse docs,schema,schemas,catalog $folder
          Copy-Item web/vendor/*.txt,web/vendor/engraving-manifest.json "$folder/licenses/engraving/"
          Copy-Item -Recurse dist/licenses/native-rust "$folder/licenses/rust"
          Copy-Item desktop-startup/native-report.json,desktop-startup/renderer-report.json "$folder/evidence/"
