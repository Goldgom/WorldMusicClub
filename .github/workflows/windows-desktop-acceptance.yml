          ACCEPTANCE_REQUIRED_STEPS: required_001,acceptance_source,required_003,required_004,required_005,acceptance_identity,required_007,required_008,required_009,required_010,required_011,required_012,native_build,required_016,required_017,required_018,required_019,required_020,required_021,required_022,required_023,required_024,required_025,required_026,required_027,complete_practice_windows,complete_practice_windows_verify,canonical_practice_windows,canonical_practice_windows_verify,required_032,management_catalog_windows,management_catalog_windows_verify,required_035,required_036,required_037,required_038,required_039,required_040,required_041,required_042,required_043,required_044,required_045,required_046,required_047,required_048,required_049,required_050,required_051,required_052,required_053,required_054,required_055,native_transfer,native_transfer_upload,native_transfer_identity
