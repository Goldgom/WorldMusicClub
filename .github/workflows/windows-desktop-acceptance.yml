  native-package:
    # Candidate creation is suppressed unless every exact-source producer succeeds.
    needs: [bulk-import-browser, windows-pure-checks, native-feature-acceptance]
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.acceptance_source.outputs.source_sha }}
      source_tree: ${{ steps.acceptance_source.outputs.source_tree }}
      run_id: ${{ github.run_id }}
      identity: ${{ steps.acceptance_identity.outputs.identity }}
      producer_gate: ${{ steps.producer_gate.outcome }}
      native_full_portable: ${{ steps.native_full_portable.outcome }}
      native_full_upload: ${{ steps.native_full_upload.outcome }}
      native_runtime_package: ${{ steps.native_runtime_package.outcome }}
      native_runtime_verify: ${{ steps.native_runtime_verify.outcome }}
      native_runtime_startup: ${{ steps.native_runtime_startup.outcome }}
      native_runtime_delivery: ${{ steps.native_runtime_delivery.outcome }}
      native_runtime_delivery_verify: ${{ steps.native_runtime_delivery_verify.outcome }}
      native_runtime_upload: ${{ steps.native_runtime_upload.outcome }}
      native_runtime_evidence: ${{ steps.native_runtime_evidence.outcome }}
      full_artifact_id: ${{ steps.native_full_upload.outputs.artifact-id }}
      runtime_artifact_id: ${{ steps.native_runtime_upload.outputs.artifact-id }}
      runtime_evidence_id: ${{ steps.native_runtime_evidence.outputs.artifact-id }}
      full_sha256: ${{ steps.native_package.outputs.sha256 }}
      runtime_sha256: ${{ steps.native_runtime_package.outputs.sha256 }}
      delivery_sha256: ${{ steps.native_runtime_delivery_verify.outputs.sha256 }}
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: required_001
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Record exact acceptance source
        id: acceptance_source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: required_003
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy, rust-docs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        id: required_004
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        id: required_005
        with:
          python-version: '3.12.10'
      # QA-only parser dependency; it is never included in the app package.
      - name: Bind exact source, locks and installed toolchain
        id: acceptance_identity
        run: python scripts/native-acceptance-join.py identity
      - run: python -m pip install PyYAML==6.0.3
        id: required_007
      - run: python scripts/check-authoring-workflow.py .github/workflows/windows-desktop-acceptance.yml
        id: required_008
      - run: npm ci --ignore-scripts --omit=optional
        id: required_009
      - name: Require every exact-source producer before downloading package inputs
        id: package_join
        env:
          ACCEPTANCE_NEEDS: ${{ toJSON(needs) }}
          ACCEPTANCE_IDENTITY: ${{ steps.acceptance_identity.outputs.identity }}
        run: python scripts/native-acceptance-join.py join
      - name: Download only this successful producer's immutable artifact
        id: native_transfer_download
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8
        with:
          artifact-ids: ${{ needs.native-feature-acceptance.outputs.transfer_artifact_id }}
          path: ${{ runner.temp }}/native-acceptance-transfer
          merge-multiple: true
      - name: Verify original bytes and source binding before restoring package inputs
        id: native_transfer_restore
        env:
          ACCEPTANCE_IDENTITY: ${{ steps.acceptance_identity.outputs.identity }}
          ACCEPTANCE_TRANSFER_SHA256: ${{ needs.native-feature-acceptance.outputs.transfer_sha256 }}
        shell: pwsh
        run: |
          python scripts/native-acceptance-transfer.py restore --workspace "$env:GITHUB_WORKSPACE" --runner-temp "$env:RUNNER_TEMP" --archive "$env:RUNNER_TEMP/native-acceptance-transfer/native-inputs.zip" --expected-sha256 "$env:ACCEPTANCE_TRANSFER_SHA256"
          if ($LASTEXITCODE -ne 0) { throw 'Native transfer byte/source verification failed' }
      - name: Package native candidate with exact provenance and notices
        id: native_package
        shell: pwsh
        run: |
          node scripts/verify-native-bulk-import-evidence.mjs --check desktop-bulk-import
          if ($LASTEXITCODE -ne 0) { throw 'Native bulk-import exact-source proof failed' }
          $bulkProof=Get-Content -Raw desktop-bulk-import/native-bulk-import-files.json | ConvertFrom-Json
          $currentTree=(git rev-parse 'HEAD^{tree}').Trim()
          $currentExe=(Get-FileHash target/release/worldmusichub-desktop.exe -Algorithm SHA256).Hash.ToLower()
          if ($bulkProof.source_sha -cne '${{ github.sha }}' -or $bulkProof.source_tree -cne $currentTree -or $bulkProof.executable_sha256 -cne $currentExe) { throw 'Bulk-import evidence does not match the exact packaged source and executable' }
          node scripts/verify-native-clean-song-evidence.mjs --check desktop-clean-song
          if ($LASTEXITCODE -ne 0) { throw 'Native clean-song exact-source proof failed' }
          $cleanProof=Get-Content -Raw desktop-clean-song/native-clean-song-files.json | ConvertFrom-Json
          if ($cleanProof.source_sha -cne '${{ github.sha }}' -or $cleanProof.source_tree -cne $currentTree -or $cleanProof.executable_sha256 -cne $currentExe) { throw 'Clean-song evidence does not match the exact packaged source and executable' }
          node scripts/verify-native-vsq-song-evidence.mjs --check desktop-vsq-song
          if ($LASTEXITCODE -ne 0) { throw 'Native VSQ exact-source proof failed' }
          $vsqProof=Get-Content -Raw desktop-vsq-song/native-vsq-song-files.json | ConvertFrom-Json
          if ($vsqProof.source_sha -cne '${{ github.sha }}' -or $vsqProof.source_tree -cne $currentTree -or $vsqProof.executable_sha256 -cne $currentExe) { throw 'VSQ evidence does not match the exact packaged source and executable' }
          node scripts/verify-native-performance-song-evidence.mjs --check desktop-performance-song
          if ($LASTEXITCODE -ne 0) { throw 'Native complete performance exact-source proof failed' }
          $performanceProof=Get-Content -Raw desktop-performance-song/native-performance-song-files.json | ConvertFrom-Json
          $currentExeBytes=(Get-Item target/release/worldmusichub-desktop.exe).Length
          if ($performanceProof.source_sha -cne '${{ github.sha }}' -or $performanceProof.source_tree -cne $currentTree -or $performanceProof.executable_sha256 -cne $currentExe -or $performanceProof.executable_bytes -ne $currentExeBytes) { throw 'Complete performance evidence does not match the exact packaged source and executable' }
          node scripts/verify-native-pitch-bend-evidence.mjs --check desktop-pitch-bend
          if ($LASTEXITCODE -ne 0) { throw 'Native pitch-bend exact-source proof failed' }
          $pitchProof=Get-Content -Raw desktop-pitch-bend/native-pitch-bend-files.json | ConvertFrom-Json
          if ($pitchProof.source_sha -cne '${{ github.sha }}' -or $pitchProof.source_tree -cne $currentTree -or $pitchProof.executable_sha256 -cne $currentExe -or $pitchProof.executable_bytes -ne $currentExeBytes) { throw 'Pitch-bend evidence does not match the exact packaged source and executable' }
          python scripts/native-pitch-bend-manifest.py desktop-pitch-bend --executable target/release/worldmusichub-desktop.exe --commit '${{ github.sha }}' --tree $currentTree
          if ($LASTEXITCODE -ne 0) { throw 'Native pitch-bend focused manifest failed' }
          node scripts/verify-native-song-authoring-evidence.mjs --check desktop-authoring
          if ($LASTEXITCODE -ne 0) { throw 'Native song authoring exact-source proof failed' }
          $authoringProof=Get-Content -Raw desktop-authoring/native-song-authoring-files.json | ConvertFrom-Json
          if ($authoringProof.source_sha -cne '${{ github.sha }}' -or $authoringProof.source_tree -cne $currentTree -or $authoringProof.executable_sha256 -cne $currentExe -or $authoringProof.executable_bytes -ne $currentExeBytes) { throw 'Song authoring evidence does not match the exact packaged source and executable' }
          python scripts/native-song-authoring-manifest.py desktop-authoring --executable target/release/worldmusichub-desktop.exe --commit '${{ github.sha }}' --tree $currentTree
          if ($LASTEXITCODE -ne 0) { throw 'Native song authoring focused manifest failed' }
          node scripts/verify-native-vsq-authoring-evidence.mjs --check desktop-vsq-authoring
          if ($LASTEXITCODE -ne 0) { throw 'Native VSQ authoring proof failed' }
          python scripts/native-vsq-authoring-manifest.py desktop-vsq-authoring --executable target/release/worldmusichub-desktop.exe --commit '${{ github.sha }}' --tree $currentTree
          if ($LASTEXITCODE -ne 0) { throw 'Native VSQ authoring source/EXE manifest failed' }
          $env:WMH_SOURCE_SHA='${{ github.sha }}'
          $env:WMH_SOURCE_TREE=$currentTree
          $env:WMH_BASIC_KEY_EXECUTABLE=(Resolve-Path 'target/release/worldmusichub-desktop.exe').Path
          node scripts/verify-basic-key-evidence.mjs --check desktop-basic-key
          if ($LASTEXITCODE -ne 0) { throw 'Basic-key evidence does not match exact packaged source and executable' }
          $env:WMH_COMPLETE_PRACTICE_EXECUTABLE=(Resolve-Path 'target/release/worldmusichub-desktop.exe').Path
          node scripts/verify-complete-practice-evidence.mjs --check desktop-complete-practice
          if ($LASTEXITCODE -ne 0) { throw 'Complete-practice evidence does not match exact packaged source and executable' }
          $env:WMH_CANONICAL_PRACTICE_EXECUTABLE=(Resolve-Path 'target/release/worldmusichub-desktop.exe').Path
          node scripts/verify-canonical-practice-evidence.mjs --check desktop-canonical-practice
          if ($LASTEXITCODE -ne 0) { throw 'Canonical-practice evidence does not match exact packaged source and executable' }
          $count=(git rev-list --count HEAD).Trim()
          $folder='dist/WorldMusicClub-Native'
          New-Item -ItemType Directory "$folder/licenses/engraving","$folder/evidence" -Force | Out-Null
          Copy-Item target/release/worldmusichub-desktop.exe "$folder/WorldMusicClub-Native.exe"
          Copy-Item LICENSE $folder
          Copy-Item desktop-basic-key/native-basic-key.json,desktop-basic-key/basic-key-proof.json,desktop-basic-key/renderer-basic-key-*.json,desktop-basic-key/profile-basic-key-*.json "$folder/evidence/"
          Copy-Item desktop-complete-practice/native-complete-practice.json,desktop-complete-practice/complete-practice-proof.json,desktop-complete-practice/renderer-complete-practice-*.json,desktop-complete-practice/profile-complete-practice-*.json "$folder/evidence/"
          # The manifest adapter copies the complete canonical gate into evidence/canonical-practice/.
          Copy-Item docs/WINDOWS_NATIVE.md "$folder/README.md"
          Copy-Item docs/WINDOWS_NATIVE.md "$folder/START-HERE.md"
          Copy-Item -Recurse docs,schema,schemas,catalog $folder
          Copy-Item web/vendor/*.txt,web/vendor/engraving-manifest.json "$folder/licenses/engraving/"
          Copy-Item -Recurse dist/licenses/native-rust "$folder/licenses/rust"
          Copy-Item desktop-startup/native-report.json,desktop-startup/renderer-report.json "$folder/evidence/"
          Copy-Item desktop-acceptance/native-acceptance.json,desktop-acceptance/downloaded-files.json,desktop-acceptance/renderer-*.json "$folder/evidence/"
          Copy-Item desktop-bulk-import/native-bulk-import.json,desktop-bulk-import/native-bulk-import-files.json,desktop-bulk-import/renderer-bulk-*.json,desktop-bulk-import/profile-bulk-*.json "$folder/evidence/"
          Copy-Item desktop-clean-song/native-clean-song.json,desktop-clean-song/native-clean-song-files.json,desktop-clean-song/renderer-clean-*.json,desktop-clean-song/profile-clean-*.json "$folder/evidence/"
          Copy-Item desktop-vsq-song/native-vsq-song.json,desktop-vsq-song/native-vsq-song-files.json,desktop-vsq-song/renderer-vsq-*.json,desktop-vsq-song/profile-vsq-*.json "$folder/evidence/"
          python scripts/native-release-manifest.py create $folder --commit '${{ github.sha }}' --count $count --startup desktop-startup --acceptance desktop-acceptance --song-folder desktop-song-folder --performance-song desktop-performance-song --pitch-bend desktop-pitch-bend --song-authoring desktop-authoring --vsq-authoring desktop-vsq-authoring --basic-key desktop-basic-key --canonical-practice desktop-canonical-practice --catalog-evidence "$env:RUNNER_TEMP/library-management-windows" --build-provenance target/release/native-build-provenance.json
          if ($LASTEXITCODE -ne 0) { throw 'Native provenance/acceptance inventory failed' }
          $zip="dist/WorldMusicClub-Native-Windows-x64-commit-$count.zip"
          python scripts/native-release-manifest.py archive $folder $zip
          if ($LASTEXITCODE -ne 0) { throw 'Native archive verification failed' }
          "archive=$zip" >> $env:GITHUB_OUTPUT
          "count=$count" >> $env:GITHUB_OUTPUT
          "sha256=$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Verify normal startup of extracted native preview
        id: native_full_portable
        shell: pwsh
        run: |
          $destination=Join-Path $env:RUNNER_TEMP 'wmh-native-portable-extracted'
          Expand-Archive -Path '${{ steps.native_package.outputs.archive }}' -DestinationPath $destination
          ./scripts/windows-native-portable-smoke.ps1 -Directory (Join-Path $destination 'WorldMusicClub-Native') -OutputDirectory desktop-portable
      # Keep the full artifact identity unchanged. Runtime is additive and is
      # derived only from this future build's already verified local full ZIP.
      - name: Upload native-only candidate pending final acceptance
        id: native_full_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: WorldMusicClub-Native-Candidate-Windows-x64-commit-${{ steps.native_package.outputs.count }}-${{ github.sha }}
          path: |
            dist/WorldMusicClub-Native-Windows-x64-*.zip
            dist/WorldMusicClub-Native-Windows-x64-*.zip.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Create runtime from this run's retained complete native ZIP
        id: native_runtime_package
        shell: pwsh
        run: |
          $zip="dist/WorldMusicClub-Native-Runtime-Windows-x64-commit-${{ steps.native_package.outputs.count }}.zip"
          $reference='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.native_full_upload.outputs.artifact-id }}'
          if ('${{ steps.native_full_upload.outputs.artifact-url }}' -cne $reference) { throw 'Full upload returned a different immutable artifact identity' }
          if ((Get-FileHash '${{ steps.native_package.outputs.archive }}' -Algorithm SHA256).Hash.ToLowerInvariant() -cne '${{ steps.native_package.outputs.sha256 }}') { throw 'Full ZIP changed after its verified pre-upload digest' }
          python scripts/native-runtime-package.py create '${{ steps.native_package.outputs.archive }}' $zip --commit '${{ github.sha }}' --tree '${{ steps.acceptance_source.outputs.source_tree }}' --evidence-reference $reference
          if ($LASTEXITCODE -ne 0) { throw 'Runtime creation/full evidence revalidation failed' }
          "archive=$zip" >> $env:GITHUB_OUTPUT
          "sha256=$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Independently verify exact runtime candidate
        id: native_runtime_verify
        shell: pwsh
        run: |
          python scripts/native-runtime-package.py verify '${{ steps.native_runtime_package.outputs.archive }}' --expected-sha256 '${{ steps.native_runtime_package.outputs.sha256 }}'
          if ($LASTEXITCODE -ne 0) { throw 'Independent runtime verification failed' }
      - name: Verify ordinary startup from fresh extracted runtime
        id: native_runtime_startup
        shell: pwsh
        run: |
          $proof=Join-Path $env:RUNNER_TEMP 'native-runtime-evidence'
          if (Test-Path $proof) { throw 'Use a fresh runtime proof directory' }
          New-Item -ItemType Directory $proof | Out-Null
          ./scripts/windows-native-runtime-smoke.ps1 -Archive '${{ steps.native_runtime_package.outputs.archive }}' -ExpectedSha256 '${{ steps.native_runtime_package.outputs.sha256 }}' -ExpectedFullSha256 '${{ steps.native_package.outputs.sha256 }}' -Destination (Join-Path $env:RUNNER_TEMP 'wmh-native-runtime-extracted') -OutputDirectory (Join-Path $proof 'startup') -Commit '${{ github.sha }}' -Tree '${{ steps.acceptance_source.outputs.source_tree }}' -RunId '${{ github.run_id }}' -Repository '${{ github.repository }}' -FullArtifactId '${{ steps.native_full_upload.outputs.artifact-id }}'
      - name: Bind full and runtime normal startup to this source and both ZIPs
        id: native_runtime_delivery
        shell: pwsh
        run: |
          python scripts/native-runtime-delivery.py create --archive '${{ steps.native_runtime_package.outputs.archive }}' --expected-sha256 '${{ steps.native_runtime_package.outputs.sha256 }}' --expected-full-sha256 '${{ steps.native_package.outputs.sha256 }}' --full-archive '${{ steps.native_package.outputs.archive }}' --extracted "$env:RUNNER_TEMP/wmh-native-runtime-extracted/WorldMusicClub-Native" --full-startup desktop-portable --runtime-startup "$env:RUNNER_TEMP/native-runtime-evidence/startup" --record "$env:RUNNER_TEMP/native-runtime-evidence/delivery.json" --commit '${{ github.sha }}' --tree '${{ steps.acceptance_source.outputs.source_tree }}' --run-id '${{ github.run_id }}' --repository '${{ github.repository }}' --full-artifact-id '${{ steps.native_full_upload.outputs.artifact-id }}'
          if ($LASTEXITCODE -ne 0) { throw 'Runtime delivery source/evidence binding failed' }
      - name: Reverify retained runtime delivery record without rewriting it
        id: native_runtime_delivery_verify
        shell: pwsh
        run: |
          python scripts/native-runtime-delivery.py verify --archive '${{ steps.native_runtime_package.outputs.archive }}' --expected-sha256 '${{ steps.native_runtime_package.outputs.sha256 }}' --expected-full-sha256 '${{ steps.native_package.outputs.sha256 }}' --full-archive '${{ steps.native_package.outputs.archive }}' --extracted "$env:RUNNER_TEMP/wmh-native-runtime-extracted/WorldMusicClub-Native" --full-startup desktop-portable --runtime-startup "$env:RUNNER_TEMP/native-runtime-evidence/startup" --record "$env:RUNNER_TEMP/native-runtime-evidence/delivery.json" --commit '${{ github.sha }}' --tree '${{ steps.acceptance_source.outputs.source_tree }}' --run-id '${{ github.run_id }}' --repository '${{ github.repository }}' --full-artifact-id '${{ steps.native_full_upload.outputs.artifact-id }}'
          if ($LASTEXITCODE -ne 0) { throw 'Retained runtime delivery record differs' }
          "sha256=$((Get-FileHash "$env:RUNNER_TEMP/native-runtime-evidence/delivery.json" -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Upload additive runtime candidate pending full checkpoint acceptance
        id: native_runtime_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: WorldMusicClub-Native-Runtime-Candidate-Windows-x64-commit-${{ steps.native_package.outputs.count }}-${{ github.sha }}
          path: |
            ${{ steps.native_runtime_package.outputs.archive }}
            ${{ steps.native_runtime_package.outputs.archive }}.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Retain final runtime delivery evidence on success and failure
        id: native_runtime_evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-runtime-delivery-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-runtime-evidence/delivery.json
            ${{ runner.temp }}/native-runtime-evidence/startup/*.json
            ${{ runner.temp }}/native-runtime-evidence/startup/*.png
            ${{ runner.temp }}/native-runtime-evidence/startup/*.log
          retention-days: 90
          if-no-files-found: error
      - name: Preserve package consumer startup evidence on success and failure
        id: required_023
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-package-consumer-evidence-${{ github.sha }}
          path: |
            desktop-portable/*.json
            desktop-portable/*.png
            desktop-portable/*.log
          retention-days: 90
          if-no-files-found: warn
      - name: Require every mandatory producer step without skips
        id: producer_gate
        if: always()
        env:
          ACCEPTANCE_STEPS: ${{ toJSON(steps) }}
          ACCEPTANCE_REQUIRED_STEPS: required_001,acceptance_source,required_003,required_004,required_005,acceptance_identity,required_007,required_008,required_009,package_join,native_transfer_download,native_transfer_restore,native_package,native_full_portable,native_full_upload,native_runtime_package,native_runtime_verify,native_runtime_startup,native_runtime_delivery,native_runtime_delivery_verify,native_runtime_upload,native_runtime_evidence,required_023
        run: python scripts/native-acceptance-join.py steps
  acceptance-summary:
    name: Native and browser acceptance summary
    needs: [bulk-import-browser, windows-pure-checks, native-feature-acceptance, native-package]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout/download/network dependency: report failures and skips too.
      - name: Require all jobs for this exact source, locks, toolchain and run
        env:
          ACCEPTANCE_NEEDS: ${{ toJSON(needs) }}
          ACCEPTANCE_SHA: ${{ github.sha }}
          ACCEPTANCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          ACCEPTANCE_RUN_ID: ${{ github.run_id }}
          ACCEPTANCE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const jobs = ['bulk-import-browser', 'windows-pure-checks', 'native-feature-acceptance', 'native-package'];
          const mandatorySteps = {
            'bulk-import-browser': ['producer_gate', 'management_pack_browser', 'management_catalog_browser', 'management_catalog_browser_verify', 'complete_practice_protocol', 'complete_practice_browser', 'canonical_practice_protocol', 'canonical_practice_browser_720', 'canonical_practice_browser_720_verify', 'canonical_practice_browser_640', 'canonical_practice_browser_640_verify'],
            'windows-pure-checks': ['producer_gate'],
            'native-feature-acceptance': ['producer_gate', 'management_catalog_windows', 'management_catalog_windows_verify', 'complete_practice_windows', 'complete_practice_windows_verify', 'canonical_practice_windows', 'canonical_practice_windows_verify'],
            'native-package': ['producer_gate', 'native_full_portable', 'native_full_upload', 'native_runtime_package', 'native_runtime_verify', 'native_runtime_startup', 'native_runtime_delivery', 'native_runtime_delivery_verify', 'native_runtime_upload', 'native_runtime_evidence'],
          };
          const needs = JSON.parse(process.env.ACCEPTANCE_NEEDS);
          const sha = process.env.ACCEPTANCE_SHA;
          const run = process.env.ACCEPTANCE_RUN_ID;
          const errors = [];
          if (!/^[0-9a-f]{40}$/.test(sha || '') || !/^[1-9][0-9]*$/.test(run || '')) {
            errors.push('Missing or invalid expected source/run identity');
          }
          const lines = [`Source: ${sha}`, `Workflow run: ${run}`];
          for (const job of jobs) {
            const { result = 'missing', outputs = {} } = needs[job] || {};
            lines.push(`${job}: ${result}; source=${outputs.source_sha || 'missing'}; tree=${outputs.source_tree || 'missing'}; run=${outputs.run_id || 'missing'}`);
            if (result !== 'success') {
              errors.push(`${job}: ${result} (success required)`);
            } else if (outputs.source_sha !== sha || outputs.run_id !== run || !/^[0-9a-f]{40}$/.test(outputs.source_tree || '')) {
              errors.push(`${job}: source/run identity is missing or differs`);
            }
            for (const step of mandatorySteps[job]) {
              const outcome = outputs[step] || 'missing';
              lines.push(`${job}/${step}: ${outcome}`);
              if (outcome !== 'success') errors.push(`${job}/${step}: ${outcome} (success required)`);
            }
          }
          const identities = [];
          for (const job of jobs) {
            const outputs = needs[job]?.outputs || {};
            try {
              const identity = JSON.parse(outputs.identity || 'null');
              const shared = ['source_sha', 'source_tree', 'run_id', 'run_attempt', 'repository', 'cargo_lock_sha256', 'npm_lock_sha256', 'rust', 'node'];
              if (!identity || Object.keys(identity).sort().join() !== [...shared, 'python', 'runner_os', 'rustflags'].sort().join()) throw Error('missing or unknown identity fields');
              for (const [field, length] of [['source_sha', 40], ['source_tree', 40], ['cargo_lock_sha256', 64], ['npm_lock_sha256', 64]]) {
                if (typeof identity[field] !== 'string' || !new RegExp(`^[0-9a-f]{${length}}$`).test(identity[field])) throw Error(`invalid ${field}`);
              }
              if (identity.source_sha !== sha || identity.source_tree !== outputs.source_tree || identity.run_id !== run || identity.run_attempt !== process.env.ACCEPTANCE_RUN_ATTEMPT || identity.repository !== process.env.ACCEPTANCE_REPOSITORY) throw Error('source/tree/run/attempt/repository differs');
              const runnerOS = job === 'bulk-import-browser' ? 'Linux' : 'Windows';
              const pythonPin = runnerOS === 'Windows' ? '3.12.10' : '3.12.14';
              if (identity.runner_os !== runnerOS) throw Error('declared runner OS differs');
              if (identity.rust !== '1.99.0' || identity.node !== 'v22.23.3' || identity.python !== pythonPin) throw Error('source-pinned platform toolchain differs');
              if (identity.rustflags !== (job === 'bulk-import-browser' ? '' : '-C target-feature=+crt-static')) throw Error('static CRT policy differs');
              const binding = shared.map(key => identity[key]);
              if (identities.length && JSON.stringify(binding) !== JSON.stringify(identities[0])) throw Error('producer source/tree/locks/toolchain differs');
              identities.push(binding);
            } catch (error) { errors.push(`${job}: invalid acceptance identity: ${error.message}`); }
          }
          const producer = needs['native-feature-acceptance']?.outputs || {};
          if (!/^[1-9][0-9]{0,19}$/.test(producer.transfer_artifact_id || '') || !/^[0-9a-f]{64}$/.test(producer.transfer_sha256 || '')) errors.push('Missing immutable native transfer artifact identity/digest');
          const native = needs['native-package']?.outputs || {};
          const repository = process.env.ACCEPTANCE_REPOSITORY;
          if (!/^[A-Za-z0-9][A-Za-z0-9-]{0,38}\/[A-Za-z0-9_][A-Za-z0-9_.-]{0,99}$/.test(repository || '')) errors.push('Missing or invalid repository');
          const artifactFields = ['full_artifact_id', 'runtime_artifact_id', 'runtime_evidence_id'];
          for (const key of artifactFields) {
            if (!/^[1-9][0-9]{0,19}$/.test(native[key] || '')) errors.push(`Missing or invalid ${key}`);
            else lines.push(`${key}: https://github.com/${repository}/actions/runs/${run}/artifacts/${native[key]}`);
          }
          if (new Set(artifactFields.map(key => native[key])).size !== artifactFields.length) errors.push('Full, runtime and delivery evidence artifacts must differ');
          for (const key of ['full_sha256', 'runtime_sha256', 'delivery_sha256']) {
            if (!/^[0-9a-f]{64}$/.test(native[key] || '')) errors.push(`Missing or invalid ${key}`);
            lines.push(`${key}: ${native[key] || 'missing'}`);
          }
          const summary = [
            `Native/browser acceptance: ${errors.length ? 'FAIL' : 'PASS'}`,
            ...lines, ...errors,
            'A native candidate artifact alone is not checkpoint acceptance.',
            'The separate full Verify WorldMusicClub workflow must also succeed for this exact source before package delivery or main promotion.',
          ].join('\n') + '\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(summary);
          if (errors.length) process.exitCode = 1;
          NODE
