name: Review pinned score candidates
on:
  push:
    branches: [dev/initial-prototype]
    paths:
      - 'catalog/sources/openscore-lieder-candidates.json'
      - 'scripts/prepare-openscore-candidates.py'
      - '.github/workflows/curated-scores.yml'
permissions:
  contents: read
jobs:
  convert-original-editions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run prepare:engraving
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: cargo build -p practice-server --locked
      - name: Install hosted display dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xvfb xauth libegl1 libgl1 libnss3 libasound2t64 libsndfile1
      - name: Convert and inspect the fixed CC0 candidate set
        run: xvfb-run -a python3 scripts/prepare-openscore-candidates.py --workspace "$RUNNER_TEMP/score-conversion" --server-binary target/debug/practice-server
      - name: Preserve source, licenses, warnings and conversion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pinned-score-candidate-review
          path: ${{ runner.temp }}/score-conversion/review-artifacts/
          if-no-files-found: error
          retention-days: 30
