name: Rhythm practice UI prototype
on:
  push:
    branches: ['diagnostic/rhythm-ui-prototype']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm test && npm run test:dom
        working-directory: prototypes/rhythm-ui
      - run: npx playwright install --with-deps chromium
      - name: Install Chinese display fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Verify real prototype interactions and capture exact-source screenshots
        run: npm run test:hosted
        working-directory: prototypes/rhythm-ui
        env:
          WMH_HOSTED_BROWSER: '1'
      - name: Retain prototype evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rhythm-ui-prototype-${{ github.sha }}
          path: prototypes/rhythm-ui/artifacts/hosted/
          if-no-files-found: warn
