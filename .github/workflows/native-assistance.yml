name: Native assistance focused preview
on:
  push:
    branches: ['preview/native-assistance']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-assistance-${{ github.ref }}
  cancel-in-progress: true
# Focused evidence only. Never package, publish a release, or promote main.
jobs:
  assistance:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - run: python -m pip install PyYAML==6.0.3
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run prepare:engraving
      - run: node --test tests/native-assistance-evidence.test.js tests/native-progression-evidence.test.js tests/practice-assistance-native-fixtures.test.js
      - run: cargo fmt --all --check
      - run: cargo test -p worldmusichub-desktop --lib acceptance::tests --release --locked
      - name: Verify original Rust progression vectors without regenerating them
        run: cargo test -p worldmusichub-desktop --test native_progression --release --locked
      - shell: pwsh
        run: ./scripts/native-assistance-contract.ps1
      - run: cargo build -p worldmusichub-desktop --release --locked
      - name: Actual legacy and progressive Mod, trusted C5, paused reset and Off process restart
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'Unexpected native source' }
          if (git status --porcelain --untracked-files=normal) { throw 'Native source is dirty' }
          ./scripts/windows-desktop-acceptance.ps1 -Executable target/release/worldmusichub-desktop.exe -OutputDirectory "$env:RUNNER_TEMP/assistance-windows" -Scenario assistance
      - name: Independently reverify exact retained source, executable and claims
        shell: pwsh
        env:
          WMH_ASSISTANCE_EXECUTABLE: ${{ github.workspace }}/target/release/worldmusichub-desktop.exe
        run: |
          node scripts/verify-native-assistance-evidence.mjs --check "$env:RUNNER_TEMP/assistance-windows"
          if ($LASTEXITCODE -ne 0) { throw 'Native assistance proof failed' }
      - name: Preserve bounded partial JSON on success or failure
        if: always()
        run: >-
          python scripts/collect-json-evidence.py
          "${{ runner.temp }}" "${{ runner.temp }}/assistance-json"
          --root assistance-windows --source-sha "${{ github.sha }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-assistance-json-${{ github.sha }}
          path: ${{ runner.temp }}/assistance-json/
          if-no-files-found: warn
          include-hidden-files: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-assistance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/assistance-windows/**
            !${{ runner.temp }}/assistance-windows/webview-profiles/**
            target/release/worldmusichub-desktop.exe
          if-no-files-found: warn
