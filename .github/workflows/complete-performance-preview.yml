name: Complete performance UI preview
on:
  push:
    branches: ['preview/complete-performance']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: complete-performance-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  performance-ui:
    name: Actual complete-event browser flow (not native or full acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.99.0'
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run prepare:engraving
      - run: node --test tests/reference-native-acceptance.test.js tests/performance-song-fixtures.test.js tests/native-performance-song-evidence.test.js
      - run: cargo build -p worldmusichub-desktop --example native_import_driver --locked
      - name: Exact original complete-event fixtures through native protocol
        env:
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
        run: node scripts/check-performance-song-native.mjs
      - run: npx playwright install --with-deps chromium
      - name: Actual chooser, prior human take, reference controls, export and restart
        env:
          WMH_HOSTED_BROWSER: '1'
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_NATIVE_IMPORT_DRIVER: ${{ github.workspace }}/target/debug/examples/native_import_driver
        run: |
          WMH_VIEWPORT_HEIGHT=720 node scripts/hosted-performance-song-check.mjs
          WMH_VIEWPORT_HEIGHT=900 node scripts/hosted-performance-song-check.mjs
      - name: Retain exact-source performance preview evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-performance-preview-${{ github.sha }}
          path: |
            test-results/performance-song/*/*.json
            test-results/performance-song/*/*.png
            test-results/performance-song/*/downloads/*
            test-results/performance-song/*/fixtures/*
            test-results/performance-song/*/Scores/clean-songs/**
            test-results/performance-song/*/Scores/clean-backups/**
            test-results/performance-song/*/Scores/imports/**
            test-results/performance-song/*/Scores/import-backups/**
          if-no-files-found: warn
