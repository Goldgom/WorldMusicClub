name: Progressive assistance focused preview
on:
  push:
    branches: ['preview/progression']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: progression-preview-${{ github.ref }}
  cancel-in-progress: true
# Original fixtures only. No release/package publication or main promotion.
jobs:
  progression:
    name: Actual Rust progressive hierarchy and trusted browser controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.99.0'
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run prepare:engraving
      - run: node --test tests/progression-preview.test.js tests/practice-progression.test.js tests/practice-progression-view.test.js tests/frontend-practice-progression.test.js
      - run: cargo test -p score-core practice_progression --locked
      - run: cargo test -p score-core --test practice_progression --locked
      - name: Independently rebuild retained vectors through real Rust handlers
        run: cargo test -p practice-server --test practice_progression_api --locked
      - run: cargo build -p practice-server --locked
      - run: npx playwright install --with-deps chromium
      - name: Real Check Apply Cancel reset Off and both viewport controls
        env:
          WMH_ARTIFACT_DIR: ${{ runner.temp }}/progression-preview
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_SERVER_BINARY: ${{ github.workspace }}/target/debug/practice-server
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          mkdir -p "$WMH_ARTIFACT_DIR"
          node --test --test-reporter=tap tests/progression-app-browser.test.js | tee "$WMH_ARTIFACT_DIR/tests.tap"
      - name: Independently verify complete claims source tree server and screenshot bytes
        env:
          WMH_SOURCE_SHA: ${{ github.sha }}
          WMH_SERVER_BINARY: ${{ github.workspace }}/target/debug/practice-server
        run: node scripts/verify-progression-preview.mjs "${{ runner.temp }}/progression-preview"
      - name: Retain bounded original evidence on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: progression-preview-${{ github.sha }}
          path: |
            ${{ runner.temp }}/progression-preview/worldmusichub-progression*.json
            ${{ runner.temp }}/progression-preview/worldmusichub-progression*.png
            ${{ runner.temp }}/progression-preview/tests.tap
          if-no-files-found: warn
